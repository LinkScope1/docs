# M1：后台访问与操作审计。以下为Path Item片段，由总OpenAPI逐项引用。

authLogin:
  x-canonical-path: /auth/login
  get:
    operationId: startAuthLogin
    tags: [auth]
    summary: 发起 Authorization Code + PKCE 登录
    x-status: reviewed
    x-owner: API/后端
    x-permission: public
    x-data-scope: SYSTEM
    x-idempotency: none
    x-audit: false
    security: []

authCallback:
  x-canonical-path: /auth/callback
  get:
    operationId: completeAuthCallback
    tags: [auth]
    summary: 完成服务端 OIDC 回调并跳转到固定前端地址
    x-status: reviewed
    x-owner: API/后端
    x-permission: public
    x-data-scope: SYSTEM
    x-idempotency: none
    x-audit: false
    security: []

authLogout:
  x-canonical-path: /auth/logout
  post:
    operationId: logoutAuth
    tags: [auth]
    summary: 删除服务端 Session 并清理 Cookie
    x-status: reviewed
    x-owner: API/后端
    x-permission: public
    x-data-scope: SYSTEM
    x-idempotency: none
    x-audit: false
    security: []
authMe:
  x-canonical-path: /auth/me
  get:
    operationId: getAuthMe
    tags: [auth]
    summary: 查询当前访问上下文
    x-status: reviewed
    x-owner: API/后端
    x-permission: authenticated
    x-data-scope: EMPLOYEE_SELF
    x-idempotency: none
    x-audit: false
    security: [{ sessionCookie: [] }]
    responses: {}

auditLogs:
  x-canonical-path: /audit-logs
  get:
    operationId: listAuditLogs
    tags: [audit-logs]
    summary: 分页查询操作日志
    x-status: reviewed
    x-owner: API/后端
    x-permission: audit.read
    x-data-scope: ORG_SUBTREE
    x-idempotency: none
    x-audit: false
    responses: {}

auditLogById:
  x-canonical-path: /audit-logs/{id}
  get:
    operationId: getAuditLog
    tags: [audit-logs]
    summary: 查询操作日志详情
    x-status: reviewed
    x-owner: API/后端
    x-permission: audit.read
    x-data-scope: ORG_SUBTREE
    x-idempotency: none
    x-audit: false
    responses: {}
