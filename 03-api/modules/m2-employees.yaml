# M2：员工管理。employeeCode 是工号及 Casdoor 登录映射字段；employeeUid 是服务端生成的只读员工ID。
# 员工调动不得通过普通PATCH直接修改org_id。
employees:
  x-canonical-path: /employees
  get:
    operationId: listEmployees
    tags: [employees]
    summary: 分页查询员工
    x-status: reviewed
    x-owner: API/后端
    x-permission: employee.read
    x-data-scope: ORG_SUBTREE
    x-idempotency: none
    x-audit: false
    parameters:
      - { $ref: '#/components/parameters/Page' }
      - { $ref: '#/components/parameters/PageSize' }
      - in: query
        name: status
        schema: { type: integer, enum: [0, 1] }
      - in: query
        name: employeeCode
        schema: { type: string, maxLength: 64 }
      - in: query
        name: employeeUid
        schema: { type: string, maxLength: 64 }
      - in: query
        name: employeeName
        schema: { type: string, maxLength: 100 }
      - in: query
        name: orgCodePrefix
        schema: { type: string, minLength: 1, maxLength: 64, pattern: '^1([0-9]{3})*$' }
    responses: {}
  post:
    operationId: createEmployee
    tags: [employees]
    summary: 创建员工
    x-status: reviewed
    x-owner: API/后端
    x-permission: employee.manage
    x-data-scope: ORG_SUBTREE
    x-idempotency: domain_key_employee_code
    x-audit: true
    description: employeeCode 仍由 HR/Casdoor/管理员提供且必填；employeeUid 由后端生成，客户端不得传入。
    responses: {}

employeeById:
  x-canonical-path: /employees/{id}
  get:
    operationId: getEmployee
    tags: [employees]
    summary: 查询员工详情
    x-status: reviewed
    x-owner: API/后端
    x-permission: employee.read
    x-data-scope: ORG_SUBTREE
    x-idempotency: none
    x-audit: false
    responses: {}
  patch:
    operationId: updateEmployee
    tags: [employees]
    summary: 修改员工基本信息
    x-status: reviewed
    x-owner: API/后端
    x-permission: employee.manage
    x-data-scope: ORG_SUBTREE
    x-idempotency: domain_key_object_version
    x-audit: true
    responses: {}
  delete:
    operationId: deleteEmployee
    tags: [employees]
    summary: 物理删除已停用员工并保留归档快照
    x-status: reviewed
    x-owner: API/后端
    x-permission: employee.delete
    x-data-scope: ORG_SUBTREE
    x-idempotency: command_key_physical_delete
    x-audit: true
    description: >-
      必须携带 Idempotency-Key 和 confirm=true、非空 reason。员工必须已停用且不存在当前绑定、资产/载体内容责任或正在写入关系的任务；历史绑定、访问事件、审计和员工快照不删除。
    responses: {}

employeeAssociatedCards:
  x-canonical-path: /employees/{id}/associated-cards
  get:
    operationId: listEmployeeAssociatedCards
    tags: [employees]
    summary: 查询员工当前关联卡
    x-status: reviewed
    x-owner: API/后端
    x-permission: employee.read
    x-data-scope: ORG_SUBTREE
    x-idempotency: none
    x-audit: false
    description: >-
      In addition to employee.read, the backend requires
      touchpoint.assignment.read and touchpoint.asset.read. Missing permissions
      return 403; they are never represented as a zero count. Item fields use
      the database mappings touchpoint_assets.asset_id, carrier_uid,
      supplier_batch_no, asset_status and
      touchpoint_employee_assignments.assignment_status; addressPages use
      touchpoint_address_pages fields through Payload.address_page_id.
    parameters:
      - { $ref: '#/components/parameters/Page' }
      - { $ref: '#/components/parameters/PageSize' }
    responses: {}

employeeEnable:
  x-canonical-path: /employees/{id}/enable
  post:
    operationId: enableEmployee
    tags: [employees]
    summary: 启用员工
    x-status: reviewed
    x-owner: API/后端
    x-permission: employee.manage
    x-data-scope: ORG_SUBTREE
    x-idempotency: domain_key_state_command
    x-audit: true
    responses: {}

employeeDisable:
  x-canonical-path: /employees/{id}/disable
  post:
    operationId: disableEmployee
    tags: [employees]
    summary: 停用员工
    x-status: reviewed
    x-owner: API/后端
    x-permission: employee.manage
    x-data-scope: ORG_SUBTREE
    x-idempotency: domain_key_state_command
    x-audit: true
    responses: {}

employeeTransfer:
  x-canonical-path: /employees/{id}/transfer
  post:
    operationId: transferEmployee
    tags: [employees]
    summary: 调动员工到其他组织
    x-status: reviewed
    x-owner: API/后端
    x-permission: employee.transfer
    x-data-scope: SOURCE_AND_TARGET_ORG
    x-idempotency: domain_key_transfer
    x-audit: true
    responses: {}
