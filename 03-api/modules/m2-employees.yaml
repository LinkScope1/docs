# M2：员工管理。员工调动不得通过普通PATCH直接修改org_id。
employees:
  get:
    tags: [employees]
    summary: 分页查询员工
    x-status: reviewed
    x-owner: API/后端
    x-permission: employee.read
    x-data-scope: ORG_SUBTREE
    x-idempotency: none
    x-audit: false
    responses: {}
  post:
    tags: [employees]
    summary: 创建员工
    x-status: reviewed
    x-owner: API/后端
    x-permission: employee.manage
    x-data-scope: ORG_SUBTREE
    x-idempotency: domain_key_employee_code
    x-audit: true
    responses: {}

employeeById:
