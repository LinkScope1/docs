# M2：员工管理。员工调动不得通过普通PATCH直接修改org_id。
employees:
  x-canonical-path: /employees
  get:
    operationId: listEmployees
    tags: [employees]
    summary: 分页查询员工
    x-status: reviewed
    x-owner: API/后端
    x-permission: employee.read
    x-data-scope: ORG_SUBTREE
    x-idempotency: none
    x-audit: false
    parameters:
      - { $ref: '#/components/parameters/Page' }
      - { $ref: '#/components/parameters/PageSize' }
      - in: query
        name: status
        schema: { type: integer, enum: [0, 1] }
      - in: query
        name: employeeCode
        schema: { type: string, maxLength: 64 }
      - in: query
        name: employeeName
        schema: { type: string, maxLength: 100 }
      - in: query
        name: orgCodePrefix
        schema: { type: string, minLength: 1, maxLength: 64, pattern: '^1([0-9]{3})*$' }
    responses: {}
  post:
    operationId: createEmployee
    tags: [employees]
    summary: 创建员工
    x-status: reviewed
    x-owner: API/后端
    x-permission: employee.manage
    x-data-scope: ORG_SUBTREE
    x-idempotency: domain_key_employee_code
    x-audit: true
    responses: {}

employeeById:
  x-canonical-path: /employees/{id}
  get:
    operationId: getEmployee
    tags: [employees]
    summary: 查询员工详情
    x-status: reviewed
    x-owner: API/后端
    x-permission: employee.read
    x-data-scope: ORG_SUBTREE
    x-idempotency: none
    x-audit: false
    responses: {}
  patch:
    operationId: updateEmployee
    tags: [employees]
    summary: 修改员工基本信息
    x-status: reviewed
    x-owner: API/后端
    x-permission: employee.manage
    x-data-scope: ORG_SUBTREE
    x-idempotency: domain_key_object_version
    x-audit: true
    responses: {}

employeeEnable:
  x-canonical-path: /employees/{id}/enable
  post:
    operationId: enableEmployee
    tags: [employees]
    summary: 启用员工
    x-status: reviewed
    x-owner: API/后端
    x-permission: employee.manage
    x-data-scope: ORG_SUBTREE
    x-idempotency: domain_key_state_command
    x-audit: true
    responses: {}

employeeDisable:
  x-canonical-path: /employees/{id}/disable
  post:
    operationId: disableEmployee
    tags: [employees]
    summary: 停用员工
    x-status: reviewed
    x-owner: API/后端
    x-permission: employee.manage
    x-data-scope: ORG_SUBTREE
    x-idempotency: domain_key_state_command
    x-audit: true
    responses: {}

employeeTransfer:
  x-canonical-path: /employees/{id}/transfer
  post:
    operationId: transferEmployee
    tags: [employees]
    summary: 调动员工到其他组织
    x-status: reviewed
    x-owner: API/后端
    x-permission: employee.transfer
    x-data-scope: SOURCE_AND_TARGET_ORG
    x-idempotency: domain_key_transfer
    x-audit: true
    responses: {}
