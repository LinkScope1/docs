    tags: [employees]
    summary: 查询员工详情
    x-status: reviewed
    x-owner: API/后端
    x-permission: employee.read
    x-data-scope: ORG_SUBTREE
    x-idempotency: none
    x-audit: false
    responses: {}
  patch:
    tags: [employees]
    summary: 修改员工基本信息
    x-status: reviewed
    x-owner: API/后端
    x-permission: employee.manage
    x-data-scope: ORG_SUBTREE
    x-idempotency: domain_key_object_version
    x-audit: true
    responses: {}

employeeEnable:
