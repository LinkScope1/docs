# M3：载体内容。org_id和employee_id由资产同步，禁止客户端指定；可选 address_page_id
# 关联银行地址页面。payload_value 是 NFC 实际写入的短链/内容，初始 Payload 未绑定页面时可为空。
# 资产创建时先在本地 Payload 中预设 short_code；首次绑定地址页面时由后端创建 LinkForty Link，
# 仅当资产和 Payload 均启用且提供方为 LinkForty 时才激活；
# Payload 接口不接受 linkfortyLinkId、targetUrl 和 customCode；目标必须从银行地址页面主数据解析。
payloads:
  x-canonical-path: /touchpoint-payloads
  get:
    operationId: listTouchpointPayloads
    tags: [touchpoint-payloads]
    summary: 分页查询载体内容
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.payload.read
    x-data-scope: ASSET_SCOPE
    x-idempotency: none
    x-audit: false
    responses: {}
  post:
    operationId: createTouchpointPayload
    tags: [touchpoint-payloads]
    summary: 创建载体内容
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.payload.manage
    x-data-scope: ASSET_SCOPE
    x-idempotency: domain_key_payload
    x-audit: true
    responses: {}

payloadById:
  x-canonical-path: /touchpoint-payloads/{id}
  get:
    operationId: getTouchpointPayload
    tags: [touchpoint-payloads]
    summary: 查询载体内容详情
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.payload.read
    x-data-scope: ASSET_SCOPE
    x-idempotency: none
    x-audit: false
    responses: {}
  patch:
    operationId: updateTouchpointPayload
    tags: [touchpoint-payloads]
    summary: 修改载体内容基本信息
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.payload.manage
    x-data-scope: ASSET_SCOPE
    x-idempotency: domain_key_object_version
    x-audit: true
    description: 提交 addressPageId 时复用统一应用 Service，不信任前端 URL 或 Link ID；同一 Link、同一目标和同一地址页面重复请求返回 NO_CHANGE。
payloadSwitchAddressPage:
  x-canonical-path: /touchpoint-payloads/{id}/switch-address-page
  post:
    operationId: switchTouchpointPayloadAddressPage
    tags: [touchpoint-payloads]
    summary: 首次绑定或切换地址页面目标
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.payload.manage
    x-required-permissions: [touchpoint.payload.manage, touchpoint.address-page.read]
    x-data-scope: ASSET_SCOPE
    x-idempotency: domain_key_link_target
    x-audit: true
    description: 未绑定 Link 的初始 Payload 使用其预设 shortCode 调用 Core 创建 Link；只有 asset_status=1、Payload status=1、providerType=1 且 Link ID 非空时才激活，否则保持 inactive。已有 Link 的 Payload 复用原 Link，不重新写 NFC。客户端只能提交已存在的 addressPageId，不能提交任意 targetUrl、LinkForty Link ID 或 customCode。
    responses: {}

payloadEnable:
  x-canonical-path: /touchpoint-payloads/{id}/enable
  post:
    operationId: enableTouchpointPayload
    tags: [touchpoint-payloads]
    summary: 启用载体内容
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.payload.manage
    x-data-scope: ASSET_SCOPE
    x-idempotency: domain_key_state_command
    x-audit: true
    responses: {}

payloadDisable:
  x-canonical-path: /touchpoint-payloads/{id}/disable
  post:
    operationId: disableTouchpointPayload
    tags: [touchpoint-payloads]
    summary: 停用载体内容
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.payload.manage
    x-data-scope: ASSET_SCOPE
    x-idempotency: domain_key_state_command
    x-audit: true
    responses: {}

payloadInvalidate:
  x-canonical-path: /touchpoint-payloads/{id}/invalidate
  post:
    operationId: invalidateTouchpointPayload
    tags: [touchpoint-payloads]
    summary: 将载体内容标记为失效
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.payload.manage
    x-data-scope: ASSET_SCOPE
    x-idempotency: domain_key_state_command
    x-audit: true
    responses: {}
