# M3：载体内容。org_id和employee_id由资产同步，禁止客户端指定。
payloads:
  get:
    tags: [touchpoint-payloads]
    summary: 分页查询载体内容
    x-status: planned
    x-owner: 待确认
    x-permission: touchpoint.payload.read
    x-data-scope: org_id_and_employee_id
    x-idempotency: false
    x-audit: false
    responses: {}
  post:
    tags: [touchpoint-payloads]
    summary: 创建载体内容
    x-status: planned
    x-owner: 待确认
    x-permission: touchpoint.payload.manage
    x-data-scope: asset_scope
    x-idempotency: true
    x-audit: true
    responses: {}

