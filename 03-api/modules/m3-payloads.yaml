# M3：载体内容。org_id和employee_id由资产同步，禁止客户端指定。
payloads:
  get:
    tags: [touchpoint-payloads]
    summary: 分页查询载体内容
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.payload.read
    x-data-scope: ASSET_SCOPE
    x-idempotency: none
    x-audit: false
    responses: {}
  post:
    tags: [touchpoint-payloads]
    summary: 创建载体内容
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.payload.manage
    x-data-scope: ASSET_SCOPE
    x-idempotency: domain_key_payload
    x-audit: true
    responses: {}

