# M3：载体内容。org_id和employee_id由资产同步，禁止客户端指定。
payloads:
  x-canonical-path: /touchpoint-payloads
  get:
    operationId: listTouchpointPayloads
    tags: [touchpoint-payloads]
    summary: 分页查询载体内容
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.payload.read
    x-data-scope: ASSET_SCOPE
    x-idempotency: none
    x-audit: false
    responses: {}

assetPayloads:
  x-canonical-path: /touchpoint-assets/{assetId}/payloads
  get:
    operationId: listTouchpointAssetPayloads
    tags: [touchpoint-payloads]
    summary: 查询指定资产的全部载体内容
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.payload.read
    x-data-scope: ASSET_SCOPE
    x-idempotency: none
    x-audit: false
    responses: {}
  post:
    operationId: createTouchpointAssetPayload
    tags: [touchpoint-payloads]
    summary: 为指定资产创建 LinkForty 短链内容
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.payload.manage
    x-data-scope: ASSET_SCOPE
    x-idempotency: domain_key_payload
    x-audit: true
    responses: {}

payloadById:
  x-canonical-path: /touchpoint-payloads/{id}
  get:
    operationId: getTouchpointPayload
    tags: [touchpoint-payloads]
    summary: 查询载体内容详情
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.payload.read
    x-data-scope: ASSET_SCOPE
    x-idempotency: none
    x-audit: false
    responses: {}
  patch:
    operationId: updateTouchpointPayload
    tags: [touchpoint-payloads]
    summary: 修改载体内容基本信息
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.payload.manage
    x-data-scope: ASSET_SCOPE
    x-idempotency: domain_key_object_version
    x-audit: true
    responses: {}

payloadEnable:
  x-canonical-path: /touchpoint-payloads/{id}/enable
  post:
    operationId: enableTouchpointPayload
    tags: [touchpoint-payloads]
    summary: 启用载体内容
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.payload.manage
    x-data-scope: ASSET_SCOPE
    x-idempotency: domain_key_state_command
    x-audit: true
    responses: {}

payloadDisable:
  x-canonical-path: /touchpoint-payloads/{id}/disable
  post:
    operationId: disableTouchpointPayload
    tags: [touchpoint-payloads]
    summary: 停用载体内容
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.payload.manage
    x-data-scope: ASSET_SCOPE
    x-idempotency: domain_key_state_command
    x-audit: true
    responses: {}

payloadInvalidate:
  x-canonical-path: /touchpoint-payloads/{id}/invalidate
  post:
    operationId: invalidateTouchpointPayload
    tags: [touchpoint-payloads]
    summary: 将载体内容标记为失效
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.payload.manage
    x-data-scope: ASSET_SCOPE
    x-idempotency: domain_key_state_command
    x-audit: true
    responses: {}
