# M3：NFC实物资产。责任员工变化必须通过M4绑定流程。
assets:
  x-canonical-path: /touchpoint-assets
  get:
    operationId: listTouchpointAssets
    tags: [touchpoint-assets]
    summary: 分页查询触点资产
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.asset.read
    x-data-scope: ASSET_SCOPE
    x-idempotency: none
    x-audit: false
    responses: {}
  post:
    operationId: createTouchpointAsset
    tags: [touchpoint-assets]
    summary: 创建库存资产
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.asset.manage
    x-data-scope: ORG_SUBTREE
    x-idempotency: domain_key_asset_code
    x-audit: true
    responses: {}

assetById:
  x-canonical-path: /touchpoint-assets/{id}
  get:
    operationId: getTouchpointAsset
    tags: [touchpoint-assets]
    summary: 查询资产详情
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.asset.read
    x-data-scope: ASSET_SCOPE
    x-idempotency: none
    x-audit: false
    responses: {}
  patch:
    operationId: updateTouchpointAsset
    tags: [touchpoint-assets]
    summary: 修改资产基本信息
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.asset.manage
    x-data-scope: ASSET_SCOPE
    x-idempotency: domain_key_object_version
    x-audit: true
    responses: {}

assetEnable:
  x-canonical-path: /touchpoint-assets/{id}/enable
  post:
    operationId: enableTouchpointAsset
    tags: [touchpoint-assets]
    summary: 启用资产
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.asset.manage
    x-data-scope: ASSET_SCOPE
    x-idempotency: domain_key_state_command
    x-audit: true
    responses: {}

assetDisable:
  x-canonical-path: /touchpoint-assets/{id}/disable
  post:
    operationId: disableTouchpointAsset
    tags: [touchpoint-assets]
    summary: 停用资产
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.asset.manage
    x-data-scope: ASSET_SCOPE
    x-idempotency: domain_key_state_command
    x-audit: true
    responses: {}

assetScrap:
  x-canonical-path: /touchpoint-assets/{id}/scrap
  post:
    operationId: scrapTouchpointAsset
    tags: [touchpoint-assets]
    summary: 永久作废资产
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.asset.scrap
    x-data-scope: ASSET_SCOPE
    x-idempotency: domain_key_state_command
    x-audit: true
    responses: {}
