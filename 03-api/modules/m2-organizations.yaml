# M2：组织管理。状态变化必须使用enable/disable命令接口。
# M2：组织管理。orgAbbr 由服务端依据组织名称生成，创建后保持稳定，客户端无需提交。
organizations:
  x-canonical-path: /organizations
  get:
    operationId: listOrganizations
    tags: [organizations]
    summary: 分页查询组织
    x-status: reviewed
    x-owner: API/后端
    x-permission: organization.read
    x-data-scope: ORG_SUBTREE
    x-idempotency: none
    x-audit: false
    parameters:
      - { $ref: '#/components/parameters/Page' }
      - { $ref: '#/components/parameters/PageSize' }
      - in: query
        name: status
        schema: { type: integer, enum: [0, 1] }
      - in: query
        name: orgCode
        schema: { type: string, maxLength: 64 }
      - in: query
        name: orgName
        schema: { type: string, maxLength: 128 }
      - in: query
        name: orgCodePrefix
        schema: { type: string, minLength: 1, maxLength: 64, pattern: '^1([0-9]{3})*$' }
    responses: {}
  post:
    operationId: createOrganization
    tags: [organizations]
    summary: 创建组织
    x-status: reviewed
    x-owner: API/后端
    x-permission: organization.manage
    x-data-scope: ORG_SUBTREE
    x-idempotency: domain_key_parent_org_name
    x-audit: true
    description: orgAbbr 由后端生成并在响应中返回，组织改名不重新计算。
    responses: {}

organizationTree:
  x-canonical-path: /organizations/tree
  get:
    operationId: listOrganizationTree
    tags: [organizations]
    summary: 按当前数据范围查询组织树
    description: ORG_SELF 只返回当前组织；ORG_SUBTREE 返回授权范围内的组织树。
    x-status: reviewed
    x-owner: API/后端
    x-permission: organization.read
    x-data-scope: ORG_SUBTREE
    x-idempotency: none
    x-audit: false
    responses: {}

organizationById:
  x-canonical-path: /organizations/{id}
  get:
    operationId: getOrganization
    tags: [organizations]
    summary: 查询组织详情
    x-status: reviewed
    x-owner: API/后端
    x-permission: organization.read
    x-data-scope: ORG_SUBTREE
    x-idempotency: none
    x-audit: false
    responses: {}
  patch:
    operationId: updateOrganization
    tags: [organizations]
    summary: 修改组织基本信息
    x-status: reviewed
    x-owner: API/后端
    x-permission: organization.manage
    x-data-scope: ORG_SUBTREE
    x-idempotency: domain_key_object_version
    x-audit: true
    description: orgAbbr 不属于可修改字段；组织改名不会重新计算已有缩写。
    responses: {}

organizationEnable:
  x-canonical-path: /organizations/{id}/enable
  post:
    operationId: enableOrganization
    tags: [organizations]
    summary: 启用组织
    x-status: reviewed
    x-owner: API/后端
    x-permission: organization.manage
    x-data-scope: ORG_SUBTREE
    x-idempotency: domain_key_state_command
    x-audit: true
    responses: {}

organizationDisable:
  x-canonical-path: /organizations/{id}/disable
  post:
    operationId: disableOrganization
    tags: [organizations]
    summary: 停用组织
    x-status: reviewed
    x-owner: API/后端
    x-permission: organization.manage
    x-data-scope: ORG_SUBTREE
    x-idempotency: domain_key_state_command
    x-audit: true
    responses: {}
