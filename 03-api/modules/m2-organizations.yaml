# M2：组织管理。状态变化必须使用enable/disable命令接口。
organizations:
  x-canonical-path: /organizations
  get:
    operationId: listOrganizations
    tags: [organizations]
    summary: 分页查询组织
    x-status: reviewed
    x-owner: API/后端
    x-permission: organization.read
    x-data-scope: ORG_SUBTREE
    x-idempotency: none
    x-audit: false
    parameters:
      - { $ref: '#/components/parameters/Page' }
      - { $ref: '#/components/parameters/PageSize' }
      - in: query
        name: status
        schema: { type: integer, enum: [0, 1] }
      - in: query
        name: orgCode
        schema: { type: string, maxLength: 64 }
      - in: query
        name: orgName
        schema: { type: string, maxLength: 128 }
      - in: query
        name: orgCodePrefix
        schema: { type: string, minLength: 1, maxLength: 64, pattern: '^1([0-9]{3})*$' }
    responses: {}
  post:
    operationId: createOrganization
    tags: [organizations]
    summary: 创建组织
    x-status: reviewed
    x-owner: API/后端
    x-permission: organization.manage
    x-data-scope: ORG_SUBTREE
    x-idempotency: domain_key_org_code
    x-audit: true
    responses: {}

organizationById:
  x-canonical-path: /organizations/{id}
  get:
    operationId: getOrganization
    tags: [organizations]
    summary: 查询组织详情
    x-status: reviewed
    x-owner: API/后端
    x-permission: organization.read
    x-data-scope: ORG_SUBTREE
    x-idempotency: none
    x-audit: false
    responses: {}
  patch:
    operationId: updateOrganization
    tags: [organizations]
    summary: 修改组织基本信息
    x-status: reviewed
    x-owner: API/后端
    x-permission: organization.manage
    x-data-scope: ORG_SUBTREE
    x-idempotency: domain_key_object_version
    x-audit: true
    responses: {}

organizationEnable:
  x-canonical-path: /organizations/{id}/enable
  post:
    operationId: enableOrganization
    tags: [organizations]
    summary: 启用组织
    x-status: reviewed
    x-owner: API/后端
    x-permission: organization.manage
    x-data-scope: ORG_SUBTREE
    x-idempotency: domain_key_state_command
    x-audit: true
    responses: {}

organizationDisable:
  x-canonical-path: /organizations/{id}/disable
  post:
    operationId: disableOrganization
    tags: [organizations]
    summary: 停用组织
    x-status: reviewed
    x-owner: API/后端
    x-permission: organization.manage
    x-data-scope: ORG_SUBTREE
    x-idempotency: domain_key_state_command
    x-audit: true
    responses: {}
