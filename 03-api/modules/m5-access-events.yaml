# M5：访问事件接入与关联。Webhook 先验签和 event_id 幂等，再解析本地 asset_id。
accessEvents:
  x-canonical-path: /access-events
  get:
    operationId: listAccessEvents
    tags: [access-events]
    summary: 分页查询访问事件
    x-status: reviewed
    x-owner: API/后端
    x-permission: access-event.read
    x-data-scope: ORG_SUBTREE
    x-idempotency: none
    x-audit: false
    description: >-
      只读、无操作审计的访问事件分页查询。过滤条件只能收窄调用方的
      ORG_SUBTREE 有效范围；`from` 包含、`to` 排除，二者必须带时区且允许相等。
    parameters:
      - name: page
        in: query
        schema: {type: integer, minimum: 1, default: 1}
      - name: pageSize
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      - name: assetId
        in: query
        schema: {type: string, pattern: '^[0-9]*[1-9][0-9]*$'}
      - name: orgId
        in: query
        description: 正 BIGINT 十进制字符串；不得扩大数据范围。
        schema: {type: string, pattern: '^[0-9]*[1-9][0-9]*$'}
      - name: employeeId
        in: query
        description: 正 BIGINT 十进制字符串；不得扩大数据范围。
        schema: {type: string, pattern: '^[0-9]*[1-9][0-9]*$'}
      - name: resolutionStatus
        in: query
        schema: {type: integer, enum: [0, 1, 2, 3]}
      - name: from
        in: query
        schema: {type: string, format: date-time}
      - name: to
        in: query
        schema: {type: string, format: date-time}
    responses:
      '200': {description: "成功；统一 `{requestId,data}` 分页 envelope，并返回 `X-Request-ID`。"}
      '401': {description: "未认证；公共错误码为认证类错误。"}
      '403': {description: "功能权限或数据范围拒绝；公共错误码为 `PERMISSION_DENIED` 或 `DATA_SCOPE_DENIED`。"}
      '422': {description: "请求结构无效；公共错误码为 `REQUEST_SCHEMA_INVALID`。"}
      '500': {description: "未预期异常；公共错误码为 `INTERNAL_ERROR`。"}

accessEventById:
  x-canonical-path: /access-events/{id}
  parameters:
    - name: id
      in: path
      required: true
      schema: {type: string, pattern: '^[0-9]*[1-9][0-9]*$'}
  get:
    operationId: getAccessEvent
    tags: [access-events]
    summary: 查询访问事件详情
    x-status: reviewed
    x-owner: API/后端
    x-permission: access-event.read
    x-data-scope: ORG_SUBTREE
    x-idempotency: none
    x-audit: false
    description: 只读、无操作审计的访问事件详情查询，结果受调用方有效数据范围限制。
    responses:
      '200': {description: "成功；统一 `{requestId,data}` envelope，并返回 `X-Request-ID`。"}
      '401': {description: "未认证；公共错误码为认证类错误。"}
      '403': {description: "功能权限或数据范围拒绝；公共错误码为 `PERMISSION_DENIED` 或 `DATA_SCOPE_DENIED`。"}
      '404': {description: "访问事件不存在；公共错误码为 `RESOURCE_NOT_FOUND`。"}
      '422': {description: "路径参数结构无效；公共错误码为 `REQUEST_SCHEMA_INVALID`。"}
      '500': {description: "未预期异常；公共错误码为 `INTERNAL_ERROR`。"}

accessEventWebhook:
  x-canonical-path: /webhooks/linkforty
  post:
    operationId: receiveLinkFortyWebhook
    tags: [linkforty-webhooks]
    summary: 接收 LinkForty 访问事件 Webhook
    x-status: reviewed
    x-owner: API/后端/LinkForty联调
    x-permission: system_webhook
    x-data-scope: SYSTEM
    x-idempotency: event_id
    x-audit: true
    description: >-
      接收 LinkForty `click_event`。服务端必须对完全原始 request body 执行
      HMAC-SHA256 验签后再解析 JSON；`event_id` 是正式幂等键，`system_webhook`
      仅表示集成主体，不是 Casdoor 用户权限。
    parameters:
      - name: X-LinkForty-Signature
        in: header
        required: true
        schema: {type: string, pattern: '^sha256=[0-9a-fA-F]{64}$'}
      - name: X-LinkForty-Event
        in: header
        schema: {type: string, maxLength: 64}
      - name: X-LinkForty-Event-ID
        in: header
        schema: {type: string, maxLength: 255}
    requestBody:
      required: true
      description: 正式 JSON envelope 为 `event`、`event_id`、`data`；`data.id` 和 `data.linkId` 为 UUID。
      content:
        application/json:
          schema: {type: object}
    responses:
      '202': {description: "已受理或幂等成功；成功返回 `eventId`、`accessEventId`、`replayed`，重放增加 `Idempotency-Replayed: true`。"}
      '400': {description: "缺少 event_id 或请求业务格式错误；公共错误码为 `WEBHOOK_EVENT_ID_MISSING` 或 `REQUEST_SCHEMA_INVALID`。"}
      '401': {description: "HMAC 签名无效；公共错误码为 `WEBHOOK_SIGNATURE_INVALID`。"}
      '409': {description: "事件状态冲突；公共错误码为 `STATE_CONFLICT`。"}
      '422': {description: "请求结构无效；公共错误码为 `REQUEST_SCHEMA_INVALID`。"}
      '500': {description: "未预期异常；公共错误码为 `INTERNAL_ERROR`。"}
      '503': {description: "密钥或依赖数据源不可用；公共错误码为 `DATA_SOURCE_UNAVAILABLE`。"}
