# M3：可复用地址页面主数据，不属于 target_resources 或 routing_rules。
# url 仅作为展示/原始内容保存，trim 后不做通用 HTTP/HTTPS 审查。
# target_url 是发送给 LinkForty Core 的目标快照；APP 页面由 metadata
# 按 card-switch-demo/app-open.html 约定生成 Bridge URL，小程序只接受公开 HTTPS Universal Link。
# addressCode 由服务端按 MINI/APP/WEB 类型前缀自动生成，普通创建请求不得提交。
addressPages:
  x-canonical-path: /touchpoint-address-pages
  get:
    operationId: listTouchpointAddressPages
    tags: [touchpoint-address-pages]
    summary: 分页查询可复用地址页面
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.address-page.read
    x-data-scope: ORG_SUBTREE
    x-idempotency: none
    x-audit: false
    responses: {}
  post:
    operationId: createTouchpointAddressPage
    tags: [touchpoint-address-pages]
    summary: 创建可复用地址页面
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.address-page.manage
    x-data-scope: ORG_SUBTREE
    x-idempotency: server_generated_prefix_sequence
    x-audit: true
    description: addressCode 由服务端生成并在响应返回；导入更新已有记录时保留原编码，新记录可留空由服务端生成。
    responses: {}

addressPageOptions:
  x-canonical-path: /touchpoint-address-pages/options
  get:
    operationId: listTouchpointAddressPageOptions
    tags: [touchpoint-address-pages]
    summary: 查询资产可使用的启用地址页面
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.address-page.read
    x-required-permissions: [touchpoint.address-page.read, touchpoint.payload.manage, touchpoint.asset.manage]
    x-data-scope: ASSET_SCOPE
    x-idempotency: none
    x-audit: false
    responses: {}

addressPageById:
  x-canonical-path: /touchpoint-address-pages/{id}
  get:
    operationId: getTouchpointAddressPage
    tags: [touchpoint-address-pages]
    summary: 查询地址页面详情
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.address-page.read
    x-data-scope: ORG_SUBTREE
    x-idempotency: none
    x-audit: false
    responses: {}
  patch:
    operationId: updateTouchpointAddressPage
    tags: [touchpoint-address-pages]
    summary: 修改地址页面可编辑字段
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.address-page.manage
    x-data-scope: ORG_SUBTREE
    x-idempotency: domain_key_object_version
    x-audit: true
    description: addressCode 和 contentType 创建后不可修改；目标配置变化会传播到已关联且未永久失效的 Payload；Core 更新失败通过补偿回滚，展示字段变化不触发 Core。
addressPageEnable:
  x-canonical-path: /touchpoint-address-pages/{id}/enable
  post:
    operationId: enableTouchpointAddressPage
    tags: [touchpoint-address-pages]
    summary: 启用地址页面
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.address-page.manage
    x-data-scope: ORG_SUBTREE
    x-idempotency: domain_key_state_command
    x-audit: true
    responses: {}

addressPageDisable:
  x-canonical-path: /touchpoint-address-pages/{id}/disable
  post:
    operationId: disableTouchpointAddressPage
    tags: [touchpoint-address-pages]
    summary: 停用地址页面并保留历史关联
    x-status: reviewed
    x-owner: API/后端
    x-permission: touchpoint.address-page.manage
    x-data-scope: ORG_SUBTREE
    x-idempotency: domain_key_state_command
    x-audit: true
    responses: {}
