              schema: { $ref: '#/components/schemas/OrganizationImportExecutionSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/ImportFileTooLarge' }
        '415': { $ref: '#/components/responses/ImportFileTypeInvalid' }
        '422': { $ref: '#/components/responses/RequestSchemaInvalid' }

  /exports/{resource}:
    get:
