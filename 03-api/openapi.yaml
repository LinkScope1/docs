openapi: 3.1.0
info:
  title: Bank Touchpoint Management API
  version: 1.3.2
  description: >-
    V1.3.2 contract for bank NFC touchpoint assets, payloads, employee
    assignments, access events and operation audit. Casdoor remains the
    identity, role and functional permission authority.
servers:
  - url: /api/v1
tags:
  - name: auth
  - name: organizations
  - name: employees
  - name: touchpoint-assets
  - name: touchpoint-payloads
  - name: assignments
  - name: access-events
  - name: linkforty-webhooks
  - name: analytics
  - name: imports
  - name: exports
  - name: audit-logs
paths:
  /auth/me:
    get:
      tags: [auth]
      operationId: getAuthMe
      x-owner: API/后端
      summary: Return the authenticated employee and effective data scope
      x-permission: authenticated
      x-data-scope: EMPLOYEE_SELF
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /organizations:
    get:
      tags: [organizations]
      operationId: listOrganizations
      x-owner: API/后端
      summary: List organizations in the caller scope
      x-permission: organization.read
      x-data-scope: ORG_SUBTREE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [organizations]
      operationId: createOrganization
      x-owner: API/后端
      summary: Create an organization
      x-permission: organization.manage
      x-data-scope: ORG_SUBTREE
      x-idempotency: domain_key_org_code
      x-audit: true
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OrganizationCreate' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /organizations/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [organizations]
      operationId: getOrganization
      x-owner: API/后端
      summary: Get an organization
      x-permission: organization.read
      x-data-scope: ORG_SUBTREE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [organizations]
      operationId: updateOrganization
      x-owner: API/后端
      summary: Update organization fields except orgCode
      x-permission: organization.manage
      x-data-scope: ORG_SUBTREE
      x-idempotency: domain_key_object_version
      x-audit: true
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OrganizationPatch' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /organizations/{id}/enable:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [organizations]
      operationId: enableOrganization
      x-owner: API/后端
      summary: Enable an organization
      x-permission: organization.manage
      x-data-scope: ORG_SUBTREE
      x-idempotency: domain_key_state_command
      x-audit: true
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /organizations/{id}/disable:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [organizations]
      operationId: disableOrganization
      x-owner: API/后端
      summary: Disable an organization
      x-permission: organization.manage
      x-data-scope: ORG_SUBTREE
      x-idempotency: domain_key_state_command
      x-audit: true
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }

  /employees:
    get:
      tags: [employees]
      operationId: listEmployees
      x-owner: API/后端
      summary: List employees in the caller scope
      x-permission: employee.read
      x-data-scope: ORG_SUBTREE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [employees]
      operationId: createEmployee
      x-owner: API/后端
      summary: Create an employee
      x-permission: employee.manage
      x-data-scope: ORG_SUBTREE
      x-idempotency: domain_key_employee_code
      x-audit: true
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/EmployeeCreate' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }

  /employees/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [employees]
      operationId: getEmployee
      x-owner: API/后端
      summary: Get an employee
      x-permission: employee.read
      x-data-scope: ORG_SUBTREE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [employees]
      operationId: updateEmployee
      x-owner: API/后端
      summary: Update employee fields except orgId
      x-permission: employee.manage
      x-data-scope: ORG_SUBTREE
      x-idempotency: domain_key_object_version
      x-audit: true
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/EmployeePatch' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /employees/{id}/enable:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [employees]
      operationId: enableEmployee
      x-owner: API/后端
      summary: Enable an employee
      x-permission: employee.manage
      x-data-scope: ORG_SUBTREE
      x-idempotency: domain_key_state_command
      x-audit: true
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /employees/{id}/disable:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [employees]
      operationId: disableEmployee
      x-owner: API/后端
      summary: Disable an employee after current bindings are ended or transferred
      x-permission: employee.manage
      x-data-scope: ORG_SUBTREE
      x-idempotency: domain_key_state_command
      x-audit: true
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /employees/{id}/transfer:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [employees]
      operationId: transferEmployee
      x-owner: API/后端
      summary: Transfer an employee between organizations
      x-permission: employee.transfer
      x-data-scope: SOURCE_AND_TARGET_ORG
      x-idempotency: domain_key_transfer
      x-audit: true
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/EmployeeTransfer' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /touchpoint-assets:
    get:
      tags: [touchpoint-assets]
      operationId: listTouchpointAssets
      x-owner: API/后端
      summary: List NFC touchpoint assets
      x-permission: touchpoint.asset.read
      x-data-scope: ASSET_SCOPE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [touchpoint-assets]
      operationId: createTouchpointAsset
      x-owner: API/后端
      summary: Create an NFC inventory asset
      x-permission: touchpoint.asset.manage
      x-data-scope: ORG_SUBTREE
      x-idempotency: domain_key_asset_code
      x-audit: true
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/TouchpointAssetCreate' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }

  /touchpoint-assets/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [touchpoint-assets]
      operationId: getTouchpointAsset
      x-owner: API/后端
      summary: Get an NFC touchpoint asset
      x-permission: touchpoint.asset.read
      x-data-scope: ASSET_SCOPE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
    patch:
      tags: [touchpoint-assets]
      operationId: updateTouchpointAsset
      x-owner: API/后端
      summary: Update asset fields except responsibility employee
      x-permission: touchpoint.asset.manage
      x-data-scope: ASSET_SCOPE
      x-idempotency: domain_key_object_version
      x-audit: true
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/TouchpointAssetPatch' }
      responses:
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
  /touchpoint-assets/{id}/enable:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [touchpoint-assets]
      operationId: enableTouchpointAsset
      x-owner: API/后端
      summary: Enable an asset
      x-permission: touchpoint.asset.manage
      x-data-scope: ASSET_SCOPE
      x-idempotency: domain_key_state_command
      x-audit: true
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      responses:
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
  /touchpoint-assets/{id}/disable:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [touchpoint-assets]
      operationId: disableTouchpointAsset
      x-owner: API/后端
      summary: Disable an asset
      x-permission: touchpoint.asset.manage
      x-data-scope: ASSET_SCOPE
      x-idempotency: domain_key_state_command
      x-audit: true
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      responses:
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
  /touchpoint-assets/{id}/scrap:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [touchpoint-assets]
      operationId: scrapTouchpointAsset
      x-owner: API/后端
      summary: Permanently scrap an asset
      x-permission: touchpoint.asset.scrap
      x-data-scope: ASSET_SCOPE
      x-idempotency: domain_key_state_command
      x-audit: true
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }

  /touchpoint-payloads:
    get:
      tags: [touchpoint-payloads]
      operationId: listTouchpointPayloads
      x-owner: API/后端
      summary: List carrier payloads
      x-permission: touchpoint.payload.read
      x-data-scope: ASSET_SCOPE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [touchpoint-payloads]
      operationId: createTouchpointPayload
      x-owner: API/后端
      summary: Create a carrier payload
      x-permission: touchpoint.payload.manage
      x-data-scope: ASSET_SCOPE
      x-idempotency: domain_key_payload
      x-audit: true
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/TouchpointPayloadCreate' }
      responses:
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201': { $ref: '#/components/responses/Success' }
  /touchpoint-payloads/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [touchpoint-payloads]
      operationId: getTouchpointPayload
      x-owner: API/后端
      summary: Get a carrier payload
      x-permission: touchpoint.payload.read
      x-data-scope: ASSET_SCOPE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
    patch:
      tags: [touchpoint-payloads]
      operationId: updateTouchpointPayload
      x-owner: API/后端
      summary: Update payload fields before invalidation
      x-permission: touchpoint.payload.manage
      x-data-scope: ASSET_SCOPE
      x-idempotency: domain_key_object_version
      x-audit: true
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/TouchpointPayloadPatch' }
      responses:
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
  /touchpoint-payloads/{id}/enable:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [touchpoint-payloads]
      operationId: enableTouchpointPayload
      x-owner: API/后端
      summary: Enable a payload
      x-permission: touchpoint.payload.manage
      x-data-scope: ASSET_SCOPE
      x-idempotency: domain_key_state_command
      x-audit: true
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      responses:
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
  /touchpoint-payloads/{id}/disable:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [touchpoint-payloads]
      operationId: disableTouchpointPayload
      x-owner: API/后端
      summary: Disable a payload
      x-permission: touchpoint.payload.manage
      x-data-scope: ASSET_SCOPE
      x-idempotency: domain_key_state_command
      x-audit: true
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      responses:
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
  /touchpoint-payloads/{id}/invalidate:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [touchpoint-payloads]
      operationId: invalidateTouchpointPayload
      x-owner: API/后端
      summary: Invalidate a payload permanently
      x-permission: touchpoint.payload.manage
      x-data-scope: ASSET_SCOPE
      x-idempotency: domain_key_state_command
      x-audit: true
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      responses:
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }

  /touchpoint-assignments:
    get:
      tags: [assignments]
      operationId: listTouchpointAssignments
      x-owner: API/后端
      summary: List current and historical assignments
      x-permission: touchpoint.assignment.read
      x-data-scope: ASSET_SCOPE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - in: query
          name: assetId
          required: false
          schema: { $ref: '#/components/schemas/Id' }
        - in: query
          name: employeeId
          required: false
          schema: { $ref: '#/components/schemas/Id' }
        - in: query
          name: orgId
          required: false
          schema: { $ref: '#/components/schemas/Id' }
        - in: query
          name: status
          required: false
          schema: { type: integer, enum: [1, 2] }
        - in: query
          name: from
          required: false
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: false
          schema: { type: string, format: date-time }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/BadRequest' }
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [assignments]
      operationId: createTouchpointAssignment
      x-owner: API/后端
      summary: Create an immediately effective same-organization assignment
      x-permission: touchpoint.assignment.manage
      x-data-scope: ASSET_SCOPE
      x-idempotency: domain_key_assignment
      x-audit: true
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/AssignmentCreate' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /touchpoint-assignments/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [assignments]
      operationId: getTouchpointAssignment
      x-owner: API/后端
      summary: Get an assignment
      x-permission: touchpoint.assignment.read
      x-data-scope: ASSET_SCOPE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BadRequest' }
        '200': { $ref: '#/components/responses/Success' }
  /touchpoint-assignments/{id}/unbind:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [assignments]
      operationId: unbindTouchpointAssignment
      x-owner: API/后端
      summary: End an active assignment
      x-permission: touchpoint.assignment.manage
      x-data-scope: ASSET_SCOPE
      x-idempotency: domain_key_assignment_unbind
      x-audit: true
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/AssignmentUnbind' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /touchpoint-assignments/transfer:
    post:
      tags: [assignments]
      operationId: transferTouchpointAssignment
      x-owner: API/后端
      summary: Transfer an asset assignment across organizations
      x-permission: touchpoint.assignment.transfer
      x-data-scope: SOURCE_AND_TARGET_ORG
      x-idempotency: domain_key_assignment_transfer
      x-audit: true
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/AssignmentTransfer' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /access-events:
    get:
      tags: [access-events]
      operationId: listAccessEvents
      x-owner: API/后端
      summary: List access events in the caller scope
      description: >-
        Read-only, non-audited access-event query. Filters can only narrow the
        caller's effective ORG_SUBTREE scope. `from` is inclusive and `to` is
        exclusive; both must include a timezone and `from` may equal `to`.
      x-permission: access-event.read
      x-data-scope: ORG_SUBTREE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - in: query
          name: assetId
          required: false
          description: Positive BIGINT identifier encoded as a decimal string.
          schema: { $ref: '#/components/schemas/Id' }
        - in: query
          name: orgId
          required: false
          description: Positive BIGINT identifier encoded as a decimal string; cannot expand scope.
          schema: { $ref: '#/components/schemas/Id' }
        - in: query
          name: employeeId
          required: false
          description: Positive BIGINT identifier encoded as a decimal string; cannot expand scope.
          schema: { $ref: '#/components/schemas/Id' }
        - in: query
          name: resolutionStatus
          required: false
          description: Association status, where 0=pending, 1=success, 2=retry, 3=failed.
          schema: { type: integer, enum: [0, 1, 2, 3] }
        - in: query
          name: from
          required: false
          description: Inclusive RFC3339 start time with timezone; must not be later than `to`.
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: false
          description: Exclusive RFC3339 end time with timezone; must not be earlier than `from`.
          schema: { type: string, format: date-time }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/RequestSchemaInvalid' }
        '500': { $ref: '#/components/responses/InternalError' }
        '200': { $ref: '#/components/responses/Success' }
  /access-events/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [access-events]
      operationId: getAccessEvent
      x-owner: API/后端
      summary: Get an access event
      x-permission: access-event.read
      x-data-scope: ORG_SUBTREE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      description: Read-only, non-audited detail query restricted to the caller's effective scope.
      security: [{ bearerAuth: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/RequestSchemaInvalid' }
        '500': { $ref: '#/components/responses/InternalError' }
        '200': { $ref: '#/components/responses/Success' }

  /webhooks/linkforty:
    post:
      tags: [linkforty-webhooks]
      operationId: receiveLinkFortyWebhook
      x-owner: API/后端/LinkForty联调
      summary: Receive a signed LinkForty click event
      x-permission: system_webhook
      x-data-scope: SYSTEM
      x-idempotency: event_id
      x-audit: true
      x-status: reviewed
      description: >-
        Receive a LinkForty `click_event`. The server verifies the HMAC-SHA256
        signature against the exact raw request bytes before parsing JSON. The
        `system_webhook` permission is an integration identity and is not a
        Casdoor user permission.
      parameters:
        - in: header
          name: X-LinkForty-Signature
          required: true
          schema: { type: string, pattern: '^sha256=[0-9a-fA-F]{64}$' }
        - in: header
          name: X-LinkForty-Event
          required: false
          schema: { type: string, maxLength: 64 }
        - in: header
          name: X-LinkForty-Event-ID
          required: false
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        description: JSON object with the canonical event envelope. Raw bytes are used for HMAC verification; secrets and raw bodies are never part of this contract.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkFortyWebhookEnvelope' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RequestSchemaInvalid' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DataSourceUnavailable' }

  /analytics/summary:
    get:
      tags: [analytics]
      operationId: getAnalyticsSummary
      x-owner: API/后端/统计
      summary: Read click, access, install and App event metrics
      description: V1.3.2 reads LinkForty data through API-only integration. The current Core API exposes click analytics; unavailable install or App aggregates fail with DATA_SOURCE_UNAVAILABLE rather than using a database readonly connection.
      x-permission: analytics.read
      x-data-scope: ORG_SUBTREE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: from
          required: true
          description: Inclusive timezone-aware start time; must be earlier than to.
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: true
          description: Exclusive timezone-aware end time; must be later than from.
          schema: { type: string, format: date-time }
        - in: query
          name: orgCodePrefix
          required: false
          description: Optional scope narrowing prefix; it cannot expand AccessContext.
          schema: { type: string, maxLength: 64, pattern: '^1([0-9]{3})*$' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/AnalyticsSuccess' }
        '503': { $ref: '#/components/responses/DataSourceUnavailable' }

  /imports/validate:
    post:
      tags: [imports]
      operationId: validateImport
      x-owner: API/后端/导入
      summary: Validate an import file without writing business tables
      description: >-
        Synchronous, read-only CSV pre-validation. Only assignment rows carry
        the required explicit operation column, whose accepted values are bind,
        unbind and transfer. Rows omitted from the CSV are ignored and never
        imply deletion, disabling or unbinding. V1.3.2 does not expose an
        import execution endpoint.
      x-permission: import.validate
      x-data-scope: ORG_SUBTREE
      x-idempotency: none
      x-audit: true
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, templateType]
              properties:
                file: { type: string, format: binary }
                templateType: { type: string, enum: [payload, assignment, asset_payload_relation] }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /exports/{resource}:
    get:
      tags: [exports]
      operationId: exportResource
      x-owner: API/后端/导出
      summary: Synchronously export a whitelisted resource within the caller scope
      x-permission: export.read
      x-data-scope: ORG_SUBTREE
      x-idempotency: none
      x-audit: true
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: resource
          required: true
          schema:
            type: string
            enum: [organizations, employees, touchpoint-assets, touchpoint-payloads, assignments, access-events, audit-logs, analytics]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: UTF-8 CSV export
          headers:
            X-Request-ID: { schema: { type: string } }
          content:
            text/csv: { schema: { type: string, format: binary } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/ExportLimitExceeded' }

  /audit-logs:
    get:
      tags: [audit-logs]
      operationId: listAuditLogs
      x-owner: API/后端
      summary: List operation logs in the caller scope
      x-permission: audit.read
      x-data-scope: ORG_SUBTREE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
  /audit-logs/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [audit-logs]
      operationId: getAuditLog
      x-owner: API/后端
      summary: Get an operation log
      x-permission: audit.read
      x-data-scope: ORG_SUBTREE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ bearerAuth: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }

components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, pattern: '^[0-9]*[1-9][0-9]*$' }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  requestBodies:
    OrganizationCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrganizationCreateRequest' }
    OrganizationPatch:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrganizationPatchRequest' }
    EmployeeCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EmployeeCreateRequest' }
    EmployeePatch:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EmployeePatchRequest' }
    EmployeeTransfer:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EmployeeTransferRequest' }
    TouchpointAssetCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TouchpointAssetCreateRequest' }
    TouchpointAssetPatch:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TouchpointAssetPatchRequest' }
    TouchpointPayloadCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TouchpointPayloadCreateRequest' }
    TouchpointPayloadPatch:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TouchpointPayloadPatchRequest' }
    AssignmentCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AssignmentCreateRequest' }
    AssignmentUnbind:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AssignmentUnbindRequest' }
    AssignmentTransfer:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AssignmentTransferRequest' }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Id:
      type: string
      pattern: '^[0-9]*[1-9][0-9]*$'
      description: Positive BIGINT identifiers are transported as decimal strings.
    NullableId:
      type: [string, 'null']
      pattern: '^[0-9]*[1-9][0-9]*$'
      description: Nullable positive BIGINT identifier encoded as a decimal string.
    Status:
      type: integer
      minimum: 0
    Metadata:
      type: object
      additionalProperties: true
    OrganizationCreateRequest:
      type: object
      additionalProperties: false
      required: [orgCode, orgName]
      properties:
        orgCode: { type: string, maxLength: 64, pattern: '^1([0-9]{3})*$' }
        orgName: { type: string, minLength: 1, maxLength: 128 }
        sortNo: { type: integer, default: 100 }
        locationCode: { type: [string, 'null'], maxLength: 64 }
        doorNo: { type: [string, 'null'], maxLength: 32 }
        contactName: { type: [string, 'null'], maxLength: 100 }
        contactPhone: { type: [string, 'null'], maxLength: 32, writeOnly: true }
        description: { type: [string, 'null'], maxLength: 500 }
    OrganizationPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        orgName: { type: string, minLength: 1, maxLength: 128 }
        sortNo: { type: integer }
        locationCode: { type: [string, 'null'], maxLength: 64 }
        doorNo: { type: [string, 'null'], maxLength: 32 }
        contactName: { type: [string, 'null'], maxLength: 100 }
        contactPhone: { type: [string, 'null'], maxLength: 32, writeOnly: true }
        description: { type: [string, 'null'], maxLength: 500 }
    EmployeeCreateRequest:
      type: object
      additionalProperties: false
      required: [employeeCode, employeeName, orgId]
      properties:
        employeeCode: { type: string, minLength: 1, maxLength: 64 }
        employeeName: { type: string, minLength: 1, maxLength: 100 }
        orgId: { $ref: '#/components/schemas/Id' }
        phone: { type: [string, 'null'], maxLength: 32, writeOnly: true }
        description: { type: [string, 'null'], maxLength: 500 }
    EmployeePatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        employeeName: { type: string, minLength: 1, maxLength: 100 }
        phone: { type: [string, 'null'], maxLength: 32, writeOnly: true }
        description: { type: [string, 'null'], maxLength: 500 }
    EmployeeTransferRequest:
      type: object
      additionalProperties: false
      required: [targetOrgId]
      properties:
        targetOrgId: { $ref: '#/components/schemas/Id' }
        reason: { type: [string, 'null'], maxLength: 500 }
    TouchpointAssetCreateRequest:
      type: object
      additionalProperties: false
      required: [assetCode, orgId]
      properties:
        assetCode: { type: string, minLength: 1, maxLength: 64 }
        assetType: { type: integer, const: 1, default: 1 }
        carrierUid: { type: [string, 'null'], maxLength: 128 }
        orgId: { $ref: '#/components/schemas/Id' }
        supplierCode: { type: [string, 'null'], maxLength: 64 }
        supplierBatchNo: { type: [string, 'null'], maxLength: 64 }
        metadata: { $ref: '#/components/schemas/Metadata' }
        description: { type: [string, 'null'], maxLength: 500 }
    TouchpointAssetPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        carrierUid: { type: [string, 'null'], maxLength: 128 }
        supplierCode: { type: [string, 'null'], maxLength: 64 }
        supplierBatchNo: { type: [string, 'null'], maxLength: 64 }
        metadata: { $ref: '#/components/schemas/Metadata' }
        description: { type: [string, 'null'], maxLength: 500 }
    TouchpointPayloadCreateRequest:
      type: object
      additionalProperties: false
      required: [assetId, payloadType, payloadValue, payloadSource]
      properties:
        assetId: { $ref: '#/components/schemas/Id' }
        payloadType: { type: integer, enum: [1, 2, 3, 99] }
        payloadValue: { type: string, minLength: 1, maxLength: 2048 }
        payloadSource: { type: integer, enum: [1, 2, 3, 4] }
        providerType: { type: integer, enum: [1, 2, 3, 99], default: 1 }
        linkfortyLinkId: { type: [string, 'null'], format: uuid }
        metadata: { $ref: '#/components/schemas/Metadata' }
    TouchpointPayloadPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        payloadValue: { type: string, minLength: 1, maxLength: 2048 }
        payloadSource: { type: integer, enum: [1, 2, 3, 4] }
        providerType: { type: integer, enum: [1, 2, 3, 99] }
        linkfortyLinkId: { type: [string, 'null'], format: uuid }
        metadata: { $ref: '#/components/schemas/Metadata' }
    AssignmentCreateRequest:
      type: object
      additionalProperties: false
      required: [assetId, employeeId]
      properties:
        assetId: { $ref: '#/components/schemas/Id' }
        employeeId: { $ref: '#/components/schemas/Id' }
    AssignmentUnbindRequest:
      type: object
      additionalProperties: false
      required: [reasonType]
      properties:
        reasonType: { type: integer, minimum: 1 }
        reason: { type: [string, 'null'], maxLength: 500 }
    AssignmentTransferRequest:
      type: object
      additionalProperties: false
      required: [assetId, targetEmployeeId, reasonType]
      properties:
        assetId: { $ref: '#/components/schemas/Id' }
        targetEmployeeId: { $ref: '#/components/schemas/Id' }
        reasonType: { type: integer, minimum: 1 }
        reason: { type: [string, 'null'], maxLength: 500 }
    Organization:
      type: object
      additionalProperties: false
      required: [id, orgCode, orgName, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        orgCode: { type: string }
        orgName: { type: string }
        status: { $ref: '#/components/schemas/Status' }
        sortNo: { type: integer }
        locationCode: { type: [string, 'null'] }
        doorNo: { type: [string, 'null'] }
        contactName: { type: [string, 'null'] }
        contactPhoneMasked: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
    Employee:
      type: object
      additionalProperties: false
      required: [id, employeeCode, employeeName, orgId, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        employeeCode: { type: string }
        employeeName: { type: string }
        orgId: { $ref: '#/components/schemas/Id' }
        phoneMasked: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/Status' }
        description: { type: [string, 'null'] }
    TouchpointAsset:
      type: object
      additionalProperties: false
      required: [id, assetCode, assetType, orgId, assetStatus]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        assetCode: { type: string }
        assetType: { type: integer, const: 1 }
        carrierUid: { type: [string, 'null'] }
        orgId: { $ref: '#/components/schemas/Id' }
        employeeId: { $ref: '#/components/schemas/NullableId' }
        assetStatus: { $ref: '#/components/schemas/Status' }
        supplierCode: { type: [string, 'null'] }
        supplierBatchNo: { type: [string, 'null'] }
        metadata: { $ref: '#/components/schemas/Metadata' }
        description: { type: [string, 'null'] }
    TouchpointPayload:
      type: object
      additionalProperties: false
      required: [id, assetId, payloadType, payloadValue, payloadSource, providerType, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        assetId: { $ref: '#/components/schemas/Id' }
        orgId: { $ref: '#/components/schemas/Id' }
        employeeId: { $ref: '#/components/schemas/NullableId' }
        payloadType: { type: integer }
        payloadValue: { type: string }
        payloadSource: { type: integer }
        providerType: { type: integer }
        linkfortyLinkId: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/Status' }
        metadata: { $ref: '#/components/schemas/Metadata' }
    Assignment:
      type: object
      additionalProperties: false
      required: [id, assetId, orgId, employeeId, assignmentStatus, effectiveFrom]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        assetId: { $ref: '#/components/schemas/Id' }
        orgId: { $ref: '#/components/schemas/Id' }
        employeeId: { $ref: '#/components/schemas/Id' }
        assignmentStatus: { type: integer, enum: [1, 2] }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: [string, 'null'], format: date-time }
        unbindReasonType: { type: [integer, 'null'] }
        unbindReason: { type: [string, 'null'] }
        replayed: { type: boolean }
    AccessEvent:
      type: object
      additionalProperties: false
      required:
        [id, eventId, clickId, assetId, bindingId, orgId, employeeId,
         resolutionStatus, resolutionReason, receivedAt, resolvedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        eventId: { type: string, minLength: 1, maxLength: 255 }
        clickId: { type: string, format: uuid }
        assetId: { $ref: '#/components/schemas/Id' }
        bindingId: { $ref: '#/components/schemas/NullableId' }
        orgId: { $ref: '#/components/schemas/NullableId' }
        employeeId: { $ref: '#/components/schemas/NullableId' }
        resolutionStatus: { type: integer, enum: [0, 1, 2, 3] }
        resolutionReason: { type: [string, 'null'] }
        receivedAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
    AuditLog:
      type: object
      additionalProperties: false
      required: [id, traceId, operationType, objectType]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        traceId: { type: string }
        orgId: { $ref: '#/components/schemas/NullableId' }
        employeeId: { $ref: '#/components/schemas/NullableId' }
        operationType: { type: integer }
        objectType: { type: integer }
        objectId: { $ref: '#/components/schemas/NullableId' }
        resultCode: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    Page:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            oneOf:
              - { $ref: '#/components/schemas/Organization' }
              - { $ref: '#/components/schemas/Employee' }
              - { $ref: '#/components/schemas/TouchpointAsset' }
              - { $ref: '#/components/schemas/TouchpointPayload' }
              - { $ref: '#/components/schemas/Assignment' }
              - { $ref: '#/components/schemas/AccessEvent' }
              - { $ref: '#/components/schemas/AuditLog' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    AnalyticsSummaryData:
      type: object
      additionalProperties: false
      required: [from, to, orgCodePrefix, clickCount, accessCount, installCount, inAppCount]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        orgCodePrefix: { type: [string, 'null'], maxLength: 64 }
        clickCount: { type: integer, minimum: 0 }
        accessCount: { type: integer, minimum: 0 }
        installCount: { type: integer, minimum: 0 }
        inAppCount: { type: integer, minimum: 0 }
      description: >-
        Clicks use click_events.clicked_at and exclude bots; access uses
        access_events.received_at; installs use install_events.installed_at;
        in-app events use in_app_events.event_timestamp. All counts are
        filtered by AccessContext and unavailable required sources return
        DATA_SOURCE_UNAVAILABLE instead of partial data.
    SuccessEnvelope:
      type: object
      required: [requestId, data]
      properties:
        requestId: { type: string }
        data:
          nullable: true
          oneOf:
            - { $ref: '#/components/schemas/Page' }
            - { $ref: '#/components/schemas/Organization' }
            - { $ref: '#/components/schemas/Employee' }
            - { $ref: '#/components/schemas/TouchpointAsset' }
            - { $ref: '#/components/schemas/TouchpointPayload' }
            - { $ref: '#/components/schemas/Assignment' }
            - { $ref: '#/components/schemas/AccessEvent' }
            - { $ref: '#/components/schemas/AuditLog' }
            - { $ref: '#/components/schemas/AnalyticsSummaryData' }
            - { $ref: '#/components/schemas/WebhookAcceptedData' }
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [field, type]
      properties:
        field: { type: string }
        type: { type: string }
        message: { type: string }
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: array
          items: { $ref: '#/components/schemas/ErrorDetail' }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [requestId, error]
      properties:
        requestId: { type: string }
        error: { $ref: '#/components/schemas/Error' }
    LinkFortyWebhookEnvelope:
      type: object
      additionalProperties: true
      required: [event, event_id, data]
      description: >-
        Canonical LinkForty envelope. `eventId` may be accepted as a legacy
        input alias by the runtime, but `event_id` is the formal contract.
        The request body must be an object and `data.id`/`data.linkId` are UUIDs.
      properties:
        event: { type: string, enum: [click_event], maxLength: 64 }
        event_id: { type: string, minLength: 1, maxLength: 255 }
        timestamp: { type: string, format: date-time }
        data:
          type: object
          required: [id, linkId]
          properties:
            id: { type: string, format: uuid }
            linkId: { type: string, format: uuid }
          additionalProperties: true
    WebhookAcceptedData:
      type: object
      additionalProperties: false
      required: [eventId, accessEventId, replayed]
      properties:
        eventId: { type: string, minLength: 1, maxLength: 255 }
        accessEventId: { $ref: '#/components/schemas/Id' }
        replayed: { type: boolean }
  responses:
    AnalyticsSuccess:
      description: Analytics summary with four aggregate counters
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema:
            type: object
            required: [requestId, data]
            additionalProperties: false
            properties:
              requestId: { type: string }
              data: { $ref: '#/components/schemas/AnalyticsSummaryData' }
    Success:
      description: Successful response. The JSON body includes `requestId` and the response includes the matching `X-Request-ID` header.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } }
    Accepted:
      description: Accepted or duplicate event acknowledged. A successful replay includes the Idempotency-Replayed response header.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
        Idempotency-Replayed:
          description: Present with value true when an existing event_id was replayed successfully.
          schema: { type: string, enum: ["true"] }
      content:
        application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } }
    BadRequest:
      description: >-
        Business request failure. For M5 Webhook this includes
        WEBHOOK_EVENT_ID_MISSING and malformed JSON/envelope
        REQUEST_SCHEMA_INVALID responses.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    RequestSchemaInvalid:
      description: Request structure, field type, format or required-field validation failure (REQUEST_SCHEMA_INVALID).
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    Unauthorized:
      description: >-
        Authentication or signature failure. For M5 Webhook an invalid HMAC
        uses WEBHOOK_SIGNATURE_INVALID.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    Forbidden:
      description: >-
        Permission or data scope denied, using PERMISSION_DENIED or
        DATA_SCOPE_DENIED as the public error code.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    NotFound:
      description: Resource not found; the public error code is RESOURCE_NOT_FOUND.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    Conflict:
      description: >-
        Unique, state or assignment conflict. M5 Webhook state conflicts use
        STATE_CONFLICT.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    DataSourceUnavailable:
      description: >-
        External data source or required Webhook signing configuration is
        unavailable; the public error code is DATA_SOURCE_UNAVAILABLE.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    InternalError:
      description: Unexpected internal error; the response contains no stack trace or sensitive details.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    ExportLimitExceeded:
      description: Synchronous export exceeds the V1.3.2 limit
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
  headers:
    RequestId:
      description: Correlation ID; exactly matches the response body's `requestId`.
      schema: { type: string, minLength: 1, maxLength: 128 }
