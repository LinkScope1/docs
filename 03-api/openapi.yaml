  /webhooks/linkforty:
    post:
      tags: [linkforty-webhooks]
      operationId: receiveLinkFortyWebhook
      x-owner: API/后端/LinkForty联调
      summary: Receive a signed LinkForty click event
      x-permission: system_webhook
      x-data-scope: SYSTEM
      x-idempotency: event_id
      x-audit: true
      x-status: reviewed
      description: >-
        Receive a LinkForty `click_event`. The server verifies the HMAC-SHA256
        signature against the exact raw request bytes before parsing JSON. The
        `system_webhook` permission is an integration identity and is not a
        Casdoor user permission.
      parameters:
        - in: header
          name: X-LinkForty-Signature
          required: true
          schema: { type: string, pattern: '^sha256=[0-9a-fA-F]{64}$' }
        - in: header
          name: X-LinkForty-Event
          required: false
          schema: { type: string, maxLength: 64 }
        - in: header
          name: X-LinkForty-Event-ID
          required: false
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        description: JSON object with the canonical event envelope. Raw bytes are used for HMAC verification; secrets and raw bodies are never part of this contract.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkFortyWebhookEnvelope' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RequestSchemaInvalid' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DataSourceUnavailable' }

  /analytics/summary:
    get:
      tags: [analytics]
      operationId: getAnalyticsSummary
      x-owner: API/后端/统计
      summary: Read click and access metrics with compatibility-preserved install/App fields
      description: >-
        V1.3.2 reads LinkForty data through API-only integration. The summary is
        defined over the half-open interval [from,to). The current Core API
        exposes click analytics only as a rolling days window, so a non-empty
        LinkForty scope cannot satisfy this exact interval and fails with
        DATA_SOURCE_UNAVAILABLE. Install/App aggregate success capability is
        excluded from V1.3.2; the response fields remain for compatibility, but
        unsupported required sources fail the whole request with
        DATA_SOURCE_UNAVAILABLE, without data or partial click/access results.
      x-permission: analytics.read
      x-data-scope: ORG_SUBTREE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: from
          required: true
          description: Inclusive timezone-aware start time; must be earlier than to.
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: true
          description: Exclusive timezone-aware end time; must be later than from.
          schema: { type: string, format: date-time }
        - in: query
          name: orgCodePrefix
          required: false
          description: Optional scope narrowing prefix; it cannot expand AccessContext.
          schema: { type: string, maxLength: 64, pattern: '^1([0-9]{3})*$' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/RequestSchemaInvalid' }
        '200': { $ref: '#/components/responses/AnalyticsSuccess' }
        '503': { $ref: '#/components/responses/DataSourceUnavailable' }

  /imports/validate:
    post:
      tags: [imports]
      operationId: validateImport
      x-owner: API/后端/导入
      summary: Validate an import file without writing business tables
      description: >-
        Synchronous, read-only pre-validation. Card, payload and employee imports use CSV;
        address-page imports accept CSV or the downloaded XLSX template. All templates use
        complete, fixed headers and Chinese enum values.
        Headers with missing, duplicate or unknown columns are rejected. Rows
        omitted from the uploaded file are ignored and never imply deletion, disabling or
        unbinding. Organization import is not a public capability. APP address
        rows require at least one platform Scheme, a non-empty opaque APP Payload,
        and a valid HTTP/HTTPS fallback address. Address-page organization is derived from
        the authenticated importing employee; the address-page template is create-only.
        For mini-program rows, URL is the target and must be an HTTPS Universal Link.
        After resolving validation errors, submit the file to the import execution endpoint.
      x-permission: import.validate
      x-data-scope: ORG_SUBTREE
      x-idempotency: none
      x-audit: true
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, templateType]
              properties:
                file: { type: string, format: binary }
                templateType: { type: string, enum: [asset, payload, employee, address_page] }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Pre-validation completed; row errors are returned in the JSON body.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportValidationSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/ImportFileTooLarge' }
        '415': { $ref: '#/components/responses/ImportFileTypeInvalid' }
        '422': { $ref: '#/components/responses/RequestSchemaInvalid' }

  /imports/execute:
    post:
      tags: [imports]
      operationId: executeUnifiedImport
      x-owner: API/后端/导入
      summary: Execute a card, payload, address page or employee import
      description: >-
        Requires a pre-validated CSV (or address-page XLSX) and an Idempotency-Key. At most 1,000
        rows execute synchronously; larger files create a Celery batch and return
        202. Each row is committed independently. Repeating the same key with
        the same request returns the existing batch; reusing it with a different
        request returns 409. Asset imports only create assets and do not match
        or update existing assets. A non-empty carrierUid is protected by its
        unique constraint, but assets without a carrierUid have no asset-level
        deduplication: submitting them again with a new key creates new assets.
        Missing rows never delete, disable, unbind or transfer existing data.
        Payload values are never included in ordinary failure reports or logs.
        Every successful execution response includes a completion summary and a
        directly renderable failures array. A terminal batch failure includes a
        safe error object with stage, errorCode and message; it may not have a
        failure-report file.
      x-permission: import.validate
      x-data-scope: ORG_SUBTREE
      x-idempotency: domain_key_import_batch
      x-audit: true
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, templateType]
              properties:
                file: { type: string, format: binary }
                templateType: { type: string, enum: [asset, payload, employee, address_page] }
      responses:
        '200':
          description: Synchronous import result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportExecutionSuccess' }
        '202':
          description: Import batch accepted for Celery execution.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportBatchSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/ImportFileTooLarge' }
        '415': { $ref: '#/components/responses/ImportFileTypeInvalid' }
        '422': { $ref: '#/components/responses/RequestSchemaInvalid' }
        '503': { $ref: '#/components/responses/DataSourceUnavailable' }

