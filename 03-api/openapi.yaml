        - in: query
          name: assetCode
          required: false
          schema: { type: string, maxLength: 64 }
        - in: query
          name: orgCodePrefix
          required: false
          schema: { type: string, minLength: 1, maxLength: 64, pattern: '^1([0-9]{3})*$' }
        - in: query
          name: employeeId
