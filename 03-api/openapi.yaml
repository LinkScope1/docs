openapi: 3.1.0
info:
  title: Bank Touchpoint Management API
  version: 1.3.2
  description: >-
    V1.3.2 contract for bank NFC touchpoint assets, payloads, employee
    assignments, access events and operation audit. Casdoor remains the
    identity, role and functional permission authority. Browser authentication
    uses the FastAPI BFF Authorization Code + PKCE flow and server-side Redis
    Session Cookie. The OIDC endpoints and claims are configuration-driven;
    this contract does not claim real Casdoor external integration is complete.
servers:
  - url: /api/v1
tags:
  - name: auth
  - name: organizations
  - name: employees
  - name: touchpoint-assets
  - name: touchpoint-address-pages
  - name: touchpoint-payloads
  - name: assignments
  - name: access-events
  - name: linkforty-webhooks
  - name: analytics
  - name: imports
  - name: exports
  - name: audit-logs
paths:
  /auth/login:
    get:
      tags: [auth]
      operationId: startAuthLogin
      x-owner: API/后端
      summary: Start Authorization Code + PKCE login
      description: >-
        Public BFF entry point. The server creates state, nonce and an S256 PKCE
        challenge, stores the one-time state server-side and returns a 302 to
        the configured Casdoor authorization endpoint. No token is placed in the URL.
      x-permission: public
      x-data-scope: SYSTEM
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: []
      responses:
        '302':
          description: Redirect to the configured Casdoor authorization endpoint.
          headers:
            Location: { schema: { type: string, format: uri } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/callback:
    get:
      tags: [auth]
      operationId: completeAuthCallback
      x-owner: API/后端
      summary: Complete the server-side OIDC callback
      description: >-
        Public callback. FastAPI consumes state once, exchanges code plus the
        server-side PKCE verifier, verifies id_token using configured JWKS and
        creates a Redis session. Success and failure redirect only to the
        configured frontend base URL plus fixed relative paths; the base URL
        must be allow-listed by FRONTEND_ORIGINS. Failure uses a stable error code.
      x-permission: public
      x-data-scope: SYSTEM
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: []
      parameters:
        - in: query
          name: code
          required: false
          schema: { type: string }
        - in: query
          name: state
          required: false
          schema: { type: string }
        - in: query
          name: error
          required: false
          schema: { type: string }
      responses:
        '302':
          description: Redirect to the configured frontend base URL plus a success or stable error path.
          headers:
            Location: { schema: { type: string, format: uri-reference } }
            Set-Cookie: { schema: { type: string } }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logoutAuth
      x-owner: API/后端
      summary: Delete the server-side session
      description: >-
        Publicly callable BFF logout endpoint. It deletes the Redis session and
        clears the bank_admin_session cookie; it does not call an unconfirmed
        external Casdoor logout endpoint. A session-cookie request still requires
        an allow-listed Origin.
      x-permission: public
      x-data-scope: SYSTEM
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: []
      responses:
        '204':
          description: Session deleted and cookie cleared.
          headers:
            Set-Cookie: { schema: { type: string } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/me:
    get:
      tags: [auth]
      operationId: getAuthMe
      x-owner: API/后端
      summary: Return the authenticated employee and effective data scope
      x-permission: authenticated
      x-data-scope: EMPLOYEE_SELF
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Normalized employee, organization, role, permission and data scope.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                type: object
                required: [requestId, data]
                properties:
                  requestId: { type: string }
                  data: { $ref: '#/components/schemas/AuthMeData' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /organizations:
    get:
      tags: [organizations]
      operationId: listOrganizations
      x-owner: API/后端
      summary: List organizations in the caller scope
      x-permission: organization.read
      x-data-scope: ORG_SUBTREE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - in: query
          name: status
          required: false
          schema: { type: integer, enum: [0, 1] }
        - in: query
          name: orgCode
          required: false
          schema: { type: string, maxLength: 64 }
        - in: query
          name: orgName
          required: false
          schema: { type: string, maxLength: 128 }
        - in: query
          name: orgCodePrefix
          required: false
          description: Optional scope narrowing prefix; it cannot expand AccessContext.
          schema: { type: string, minLength: 1, maxLength: 64, pattern: '^1([0-9]{3})*$' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [organizations]
      operationId: createOrganization
      x-owner: API/后端
      summary: Create an organization
      x-permission: organization.manage
      x-data-scope: ORG_SUBTREE
      x-idempotency: domain_key_parent_org_name
      x-audit: true
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      requestBody: { $ref: '#/components/requestBodies/OrganizationCreate' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /organizations/tree:
    get:
      tags: [organizations]
      operationId: listOrganizationTree
      x-owner: API/后端
      summary: List organizations as a scoped tree
      description: The response is always filtered by the caller AccessContext. ORG_SELF returns only the current organization; ORG_SUBTREE returns the authorized subtree.
      x-permission: organization.read
      x-data-scope: ORG_SUBTREE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /organizations/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [organizations]
      operationId: getOrganization
      x-owner: API/后端
      summary: Get an organization
      x-permission: organization.read
      x-data-scope: ORG_SUBTREE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [organizations]
      operationId: updateOrganization
      x-owner: API/后端
      summary: Update organization fields except orgCode
      x-permission: organization.manage
      x-data-scope: ORG_SUBTREE
      x-idempotency: domain_key_object_version
      x-audit: true
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      requestBody: { $ref: '#/components/requestBodies/OrganizationPatch' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /organizations/{id}/enable:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [organizations]
      operationId: enableOrganization
      x-owner: API/后端
      summary: Enable an organization
      x-permission: organization.manage
      x-data-scope: ORG_SUBTREE
      x-idempotency: domain_key_state_command
      x-audit: true
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /organizations/{id}/disable:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [organizations]
      operationId: disableOrganization
      x-owner: API/后端
      summary: Disable an organization
      x-permission: organization.manage
      x-data-scope: ORG_SUBTREE
      x-idempotency: domain_key_state_command
      x-audit: true
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }

  /employees:
    get:
      tags: [employees]
      operationId: listEmployees
      x-owner: API/后端
      summary: List employees in the caller scope
      x-permission: employee.read
      x-data-scope: ORG_SUBTREE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      description: >-
        The associatedCardCount projection is populated only when the caller
        also has touchpoint.assignment.read and touchpoint.asset.read; it is
        null when the aggregate is not available under the caller's permissions.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - in: query
          name: status
          required: false
          schema: { type: integer, enum: [0, 1] }
        - in: query
          name: employeeCode
          required: false
          schema: { type: string, maxLength: 64 }
        - in: query
          name: employeeUid
          required: false
          schema: { type: string, maxLength: 64 }
        - in: query
          name: employeeName
          required: false
          schema: { type: string, maxLength: 100 }
        - in: query
          name: orgCodePrefix
          required: false
          description: Optional scope narrowing prefix; it cannot expand AccessContext.
          schema: { type: string, minLength: 1, maxLength: 64, pattern: '^1([0-9]{3})*$' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [employees]
      operationId: createEmployee
      x-owner: API/后端
      summary: Create an employee
      x-permission: employee.manage
      x-data-scope: ORG_SUBTREE
      x-idempotency: domain_key_employee_code
      x-audit: true
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      requestBody: { $ref: '#/components/requestBodies/EmployeeCreate' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }

  /employees/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [employees]
      operationId: getEmployee
      x-owner: API/后端
      summary: Get an employee
      x-permission: employee.read
      x-data-scope: ORG_SUBTREE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [employees]
      operationId: updateEmployee
      x-owner: API/后端
      summary: Update employee fields except orgId
      x-permission: employee.manage
      x-data-scope: ORG_SUBTREE
      x-idempotency: domain_key_object_version
      x-audit: true
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      requestBody: { $ref: '#/components/requestBodies/EmployeePatch' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [employees]
      operationId: deleteEmployee
      x-owner: API/后端
      summary: Physically delete a disabled employee and retain a tombstone
      description: >-
        Requires explicit confirmation and a non-empty reason. The employee row
        is physically deleted only after the same-transaction lock and guard
        checks pass; historical bindings, access events, audit logs and the
        employee snapshot remain traceable through the archive table.
      x-permission: employee.delete
      x-data-scope: ORG_SUBTREE
      x-idempotency: command_key_physical_delete
      x-audit: true
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { $ref: '#/components/requestBodies/MasterDataDelete' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RequestSchemaInvalid' }
        '500': { $ref: '#/components/responses/InternalError' }

  /employees/{id}/associated-cards:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [employees]
      operationId: listEmployeeAssociatedCards
      x-owner: API/后端
      summary: List an employee's currently associated cards
      description: >-
        Returns current M4 bindings only. A card is counted when the assignment
        has assignment_status=1 and effective_to is null. The response fields
        are projections of the bank_admin database tables; payloadValue is not
        returned. Address pages include database address-page fields referenced
        by non-invalid Payload rows. In addition to employee.read, the backend
        requires touchpoint.assignment.read and touchpoint.asset.read; missing
        permissions return 403 and are never represented as a zero count. The
        item mappings are assetId=touchpoint_assets.asset_id,
        carrierUid=touchpoint_assets.carrier_uid,
        supplierBatchNo=touchpoint_assets.supplier_batch_no,
        assignmentStatus=touchpoint_employee_assignments.assignment_status,
        assetStatus=touchpoint_assets.asset_status, and addressPages are
        touchpoint_address_pages fields reached through
        touchpoint_payloads.address_page_id.
      x-permission: employee.read
      x-data-scope: ORG_SUBTREE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/RequestSchemaInvalid' }

  /employees/{id}/enable:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [employees]
      operationId: enableEmployee
      x-owner: API/后端
      summary: Enable an employee
      x-permission: employee.manage
      x-data-scope: ORG_SUBTREE
      x-idempotency: domain_key_state_command
      x-audit: true
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /employees/{id}/disable:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [employees]
      operationId: disableEmployee
      x-owner: API/后端
      summary: Disable an employee after current bindings are ended or transferred
      x-permission: employee.manage
      x-data-scope: ORG_SUBTREE
      x-idempotency: domain_key_state_command
      x-audit: true
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /employees/{id}/transfer:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [employees]
      operationId: transferEmployee
      x-owner: API/后端
      summary: Transfer an employee between organizations
      x-permission: employee.transfer
      x-data-scope: SOURCE_AND_TARGET_ORG
      x-idempotency: domain_key_transfer
      x-audit: true
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      requestBody: { $ref: '#/components/requestBodies/EmployeeTransfer' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /touchpoint-assets:
    get:
      tags: [touchpoint-assets]
      operationId: listTouchpointAssets
      x-owner: API/后端
      summary: List NFC touchpoint assets
      x-permission: touchpoint.asset.read
      x-data-scope: ASSET_SCOPE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - in: query
          name: assetStatus
          required: false
          schema: { type: integer, enum: [0, 1, 2, 9] }
        - in: query
          name: assetId
          required: false
          description: Card ID prefix; a complete card ID uniquely identifies one asset.
          schema: { type: string, maxLength: 13, pattern: '^PK[0-9]{0,11}$' }
        - in: query
          name: orgCodePrefix
          required: false
          schema: { type: string, minLength: 1, maxLength: 64, pattern: '^1([0-9]{3})*$' }
        - in: query
          name: employeeId
          required: false
          schema: { $ref: '#/components/schemas/Id' }
        - in: query
          name: employeeName
          required: false
          schema: { type: string, maxLength: 100 }
        - in: query
          name: carrierUid
          required: false
          schema: { type: string, maxLength: 128 }
        - in: query
          name: supplierBatchNo
          required: false
          schema: { type: string, maxLength: 64 }
        - in: query
          name: createdFrom
          required: false
          schema: { type: string, format: date-time }
        - in: query
          name: createdTo
          required: false
          schema: { type: string, format: date-time }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [touchpoint-assets]
      operationId: createTouchpointAsset
      x-owner: API/后端
      summary: Create an NFC inventory asset
      x-permission: touchpoint.asset.manage
      x-data-scope: ORG_SUBTREE
      x-idempotency: none
      x-audit: true
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      requestBody: { $ref: '#/components/requestBodies/TouchpointAssetCreate' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }

  /touchpoint-assets/statistics:
    get:
      tags: [touchpoint-assets]
      operationId: getTouchpointAssetStatistics
      x-owner: API/后端
      summary: Get asset counts for the current filters and data scope
      x-permission: touchpoint.asset.read
      x-data-scope: ASSET_SCOPE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: assetStatus, required: false, schema: { type: string, enum: ['0', '1', '2', '9'] } }
        - { in: query, name: assetId, required: false, description: Card ID prefix, schema: { type: string, maxLength: 13, pattern: '^PK[0-9]{0,11}$' } }
        - { in: query, name: orgCodePrefix, required: false, schema: { type: string, maxLength: 64 } }
        - { in: query, name: employeeId, required: false, schema: { $ref: '#/components/schemas/Id' } }
        - { in: query, name: employeeName, required: false, schema: { type: string, maxLength: 100 } }
        - { in: query, name: carrierUid, required: false, schema: { type: string, maxLength: 128 } }
        - { in: query, name: supplierBatchNo, required: false, schema: { type: string, maxLength: 64 } }
        - { in: query, name: createdFrom, required: false, schema: { type: string, format: date-time } }
        - { in: query, name: createdTo, required: false, schema: { type: string, format: date-time } }
      description: >-
        Returns total stock, enabled/disabled bound and unbound counts, and
        scrapped count. It uses the same filters as the asset list and does not
        create a statistics table.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /touchpoint-assets/batch-bind:
    post:
      tags: [touchpoint-assets]
      operationId: batchBindTouchpointAssets
      x-owner: API/后端
      summary: Bind one employee to selected assets
      x-permission: touchpoint.assignment.manage
      x-data-scope: ASSET_SCOPE
      x-idempotency: Idempotency-Key
      x-audit: true
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody: { $ref: '#/components/requestBodies/BatchBind' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '202': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DataSourceUnavailable' }

  /touchpoint-assets/batch-unbind:
    post:
      tags: [touchpoint-assets]
      operationId: batchUnbindTouchpointAssets
      x-owner: API/后端
      summary: Unbind selected assets
      x-permission: touchpoint.assignment.manage
      x-data-scope: ASSET_SCOPE
      x-idempotency: Idempotency-Key
      x-audit: true
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody: { $ref: '#/components/requestBodies/BatchUnbind' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '202': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DataSourceUnavailable' }

  /touchpoint-assets/batch-configure:
