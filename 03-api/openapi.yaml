openapi: 3.1.0
info:
  title: Bank Touchpoint Management API
  version: 1.3.0-draft
  description: >-
    V1.3 contract for organizations, employees, NFC assets, payloads,
    employee assignments, access events, audit logs and document import
    reservation. Casdoor is the identity and functional permission authority.
servers:
  - url: /api/v1
tags:
  - name: auth
  - name: organizations
  - name: employees
  - name: touchpoint-assets
  - name: touchpoint-payloads
  - name: assignments
  - name: imports
  - name: access-events
  - name: analytics
  - name: audit-logs
paths:
  /auth/me:
    get:
      tags: [auth]
      summary: Return the authenticated employee and effective data scope
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /organizations:
    get:
      tags: [organizations]
      summary: List organizations in the caller data scope
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: orgCodePrefix
          schema: { type: string, pattern: '^1([0-9]{3})*$' }
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [organizations]
      summary: Create an organization using an encoded orgCode
      security: [{ bearerAuth: [] }]
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /employees:
    get:
      tags: [employees]
      summary: List employees in the caller data scope
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [employees]
      summary: Create an employee
      security: [{ bearerAuth: [] }]
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /imports/validate:
    post:
      tags: [imports]
      summary: Validate a document-import file without committing changes
      description: >-
        Reserved contract for payload, employee-assignment and asset-payload
        relation templates. Matching uses orgCode, employeeCode, assetCode or
        carrierUid. Missing rows never imply deletion or unbinding.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /imports/execute:
    post:
      tags: [imports]
      summary: Execute a previously validated document import
      description: >-
        Future implementation may update matching rows or create missing rows.
        Unbind and replacement require an explicit row operation.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /access-events:
    get:
      tags: [access-events]
      summary: List access events in the caller data scope
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /audit-logs:
    get:
      tags: [audit-logs]
      summary: List operation logs in the caller data scope
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
components:
  parameters:
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
    Envelope:
      type: object
      required: [requestId]
      properties:
        requestId: { type: string }
        data: { nullable: true }
        error:
          nullable: true
          $ref: '#/components/schemas/Error'
  responses:
    Success:
      description: Successful response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    BadRequest:
      description: Invalid input or row validation failure
    Unauthorized:
      description: Authentication required, invalid, or inactive employee
    Forbidden:
      description: Permission or data scope denied
