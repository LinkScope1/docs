          name: payloadSource
          required: false
          schema: { type: string, enum: ['1', '2', '3', '4'] }
        - in: query
          name: addressCode
          required: false
          schema: { type: string, maxLength: 64 }
        - in: query
          name: addressName
          required: false
          schema: { type: string, maxLength: 128 }
        - in: query
          name: url
          required: false
          schema: { type: string, maxLength: 2048 }
        - in: query
          name: contentType
          required: false
          schema: { type: integer, enum: [1, 2, 3] }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: UTF-8 CSV export
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            X-Export-Status: { $ref: '#/components/headers/ExportStatus' }
            X-Export-Outcome: { $ref: '#/components/headers/ExportOutcome' }
            X-Export-Message-Code: { $ref: '#/components/headers/ExportMessageCode' }
            X-Export-Total: { $ref: '#/components/headers/ExportCount' }
            X-Export-Succeeded: { $ref: '#/components/headers/ExportCount' }
            X-Export-Failed: { $ref: '#/components/headers/ExportCount' }
          content:
            text/csv: { schema: { type: string, format: binary } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/ExportLimitExceeded' }

  /audit-logs:
    get:
      tags: [audit-logs]
      operationId: listAuditLogs
      x-owner: API/后端
      summary: List operation logs in the caller scope
      x-permission: audit.read
      x-data-scope: ORG_SUBTREE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - in: query
          name: traceId
          required: false
          schema: { type: string, maxLength: 64 }
        - in: query
          name: employeeId
          required: false
          schema: { $ref: '#/components/schemas/Id' }
        - in: query
          name: objectType
          required: false
          schema: { type: integer, minimum: 1 }
        - in: query
          name: objectId
          required: false
          schema: { $ref: '#/components/schemas/Id' }
        - in: query
          name: operationResult
          required: false
          schema: { type: integer, enum: [1, 2, 3] }
        - in: query
          name: from
          required: false
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: false
          schema: { type: string, format: date-time }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/AuditLogListSuccess' }
  /audit-logs/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [audit-logs]
      operationId: getAuditLog
      x-owner: API/后端
      summary: Get an operation log
      x-permission: audit.read
      x-data-scope: ORG_SUBTREE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { $ref: '#/components/responses/AuditLogDetailSuccess' }

components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, pattern: '^[0-9]*[1-9][0-9]*$' }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  requestBodies:
    OrganizationCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrganizationCreateRequest' }
    OrganizationPatch:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrganizationPatchRequest' }
    EmployeeCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EmployeeCreateRequest' }
    EmployeePatch:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EmployeePatchRequest' }
    EmployeeTransfer:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EmployeeTransferRequest' }
    MasterDataDelete:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MasterDataDeleteRequest' }
    TouchpointAssetCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TouchpointAssetCreateRequest' }
    TouchpointAssetPatch:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TouchpointAssetPatchRequest' }
    TouchpointAddressPageCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TouchpointAddressPageCreateRequest' }
    TouchpointAddressPagePatch:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TouchpointAddressPagePatchRequest' }
    TouchpointPayloadCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TouchpointPayloadCreateRequest' }
    TouchpointPayloadPatch:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TouchpointPayloadPatchRequest' }
    TouchpointPayloadSwitchAddressPage:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TouchpointPayloadSwitchAddressPageRequest' }
    AssignmentCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AssignmentCreateRequest' }
    AssignmentUnbind:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AssignmentUnbindRequest' }
    AssignmentTransfer:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AssignmentTransferRequest' }
    BatchBind:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BatchBindRequest' }
    BatchUnbind:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BatchUnbindRequest' }
    BatchConfigure:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BatchConfigureRequest' }
    AssetConfiguration:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AssetConfigurationRequest' }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: bank_admin_session
  schemas:
    AuthMeData:
      type: object
      additionalProperties: false
      required:
        [employeeId, employeeCode, employeeName, orgId, orgCode, orgName,
         roles, permissions, scope, scopeRoots]
      description: >-
        Normalized server-side session context. It never contains a subject,
        access_token, id_token, refresh_token, password or secret.
      properties:
        employeeId: { $ref: '#/components/schemas/Id' }
        employeeCode: { type: string, minLength: 1, maxLength: 64 }
        employeeName: { type: string, minLength: 1, maxLength: 100 }
        orgId: { $ref: '#/components/schemas/Id' }
        orgCode: { type: string, minLength: 1, maxLength: 64 }
        orgName: { type: string, minLength: 1, maxLength: 128 }
        roles:
          type: array
          items: { type: string, minLength: 1 }
        permissions:
          type: array
          items: { type: string, minLength: 1 }
        scope:
          type: string
          enum: [GLOBAL, ORG_SUBTREE, ORG_SELF, EMPLOYEE_SELF, ASSET_SCOPE]
        scopeRoots:
          type: array
          items: { type: string, minLength: 1 }
    Id:
      type: string
      pattern: '^[0-9]*[1-9][0-9]*$'
      description: Positive BIGINT identifiers are transported as decimal strings.
    NullableId:
      type: [string, 'null']
      pattern: '^[0-9]*[1-9][0-9]*$'
      description: Nullable positive BIGINT identifier encoded as a decimal string.
    Status:
      type: integer
      minimum: 0
    Metadata:
      type: object
      additionalProperties: true
    OrganizationCreateRequest:
      type: object
      additionalProperties: false
      required: [orgName]
      properties:
        parentOrganizationId: { $ref: '#/components/schemas/NullableId' }
        orgName: { type: string, minLength: 1, maxLength: 128 }
        sortNo: { type: integer, default: 100 }
        locationCode: { type: [string, 'null'], maxLength: 64 }
        doorNo: { type: [string, 'null'], maxLength: 32 }
        contactName: { type: [string, 'null'], maxLength: 100 }
        contactPhone: { type: [string, 'null'], maxLength: 32, writeOnly: true }
        description: { type: [string, 'null'], maxLength: 500 }
    OrganizationTreeNode:
      type: object
      additionalProperties: false
      required: [id, orgCode, orgName, orgAbbr, status, children]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        orgCode: { type: string }
        orgName: { type: string }
        orgAbbr: { type: string, minLength: 2, maxLength: 12, pattern: '^[A-Z][A-Z0-9]{1,11}$', readOnly: true, description: '服务端生成且创建后稳定不变的机构缩写。' }
        status: { $ref: '#/components/schemas/Status' }
        children:
          type: array
          items: { $ref: '#/components/schemas/OrganizationTreeNode' }
    OrganizationPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        orgName: { type: string, minLength: 1, maxLength: 128 }
        sortNo: { type: integer }
        locationCode: { type: [string, 'null'], maxLength: 64 }
        doorNo: { type: [string, 'null'], maxLength: 32 }
        contactName: { type: [string, 'null'], maxLength: 100 }
        contactPhone: { type: [string, 'null'], maxLength: 32, writeOnly: true }
        description: { type: [string, 'null'], maxLength: 500 }
    EmployeeCreateRequest:
      type: object
      additionalProperties: false
      description: >-
        employeeCode is the HR/Casdoor-provided employee number and remains the
        employee_code claim mapping used by authentication. employeeUid is
        server-generated and is not accepted in this request or used for Casdoor authentication.
      required: [employeeCode, employeeName, orgId]
      properties:
        employeeCode: { type: string, minLength: 1, maxLength: 64, description: '工号；继续作为 Casdoor Token 的 employee_code Claim 映射字段。' }
        employeeName: { type: string, minLength: 1, maxLength: 100 }
        orgId: { $ref: '#/components/schemas/Id' }
        phone: { type: [string, 'null'], maxLength: 32, writeOnly: true }
        description: { type: [string, 'null'], maxLength: 500 }
    EmployeePatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        employeeName: { type: string, minLength: 1, maxLength: 100 }
        phone: { type: [string, 'null'], maxLength: 32, writeOnly: true }
        description: { type: [string, 'null'], maxLength: 500 }
    EmployeeTransferRequest:
      type: object
      additionalProperties: false
      required: [targetOrgId]
      properties:
        targetOrgId: { $ref: '#/components/schemas/Id' }
        reason: { type: [string, 'null'], maxLength: 500 }
    MasterDataDeleteRequest:
      type: object
      additionalProperties: false
      required: [confirm, reason]
      properties:
        confirm: { type: boolean, description: '必须为 true 才允许物理删除。' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    TouchpointAssetCreateRequest:
      type: object
      additionalProperties: false
      description: assetId is the server-generated business Card ID and must not be submitted by the client. Creation also writes exactly one unbound initial Payload and returns its preset shortCode. Retrying a request without an idempotency key may create another asset unless carrierUid conflicts.
      required: [orgId]
      properties:
        assetType: { type: integer, const: 1, default: 1 }
        carrierUid: { type: [string, 'null'], maxLength: 128 }
        orgId: { $ref: '#/components/schemas/Id' }
        supplierCode: { type: [string, 'null'], maxLength: 64 }
        supplierBatchNo: { type: [string, 'null'], maxLength: 64 }
        description: { type: [string, 'null'], maxLength: 500 }
        customCode: { type: [string, 'null'], maxLength: 20, description: '可选预设短码；严格复用 Core，仅限制最大 20 位，不限制最小位数、字符或大小写；空字符串按自动生成处理。' }
    TouchpointAssetPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        carrierUid: { type: [string, 'null'], maxLength: 128 }
        supplierCode: { type: [string, 'null'], maxLength: 64 }
        supplierBatchNo: { type: [string, 'null'], maxLength: 64 }
        description: { type: [string, 'null'], maxLength: 500 }
    BatchAssetIds:
      type: array
      minItems: 1
      maxItems: 100000
      uniqueItems: true
      items: { $ref: '#/components/schemas/Id' }
    BatchBindRequest:
      type: object
      additionalProperties: false
      required: [assetIds, employeeId]
      properties:
        assetIds: { $ref: '#/components/schemas/BatchAssetIds' }
        employeeId: { $ref: '#/components/schemas/Id' }
        idempotencyKey: { type: [string, 'null'], maxLength: 128 }
    BatchUnbindRequest:
      type: object
      additionalProperties: false
      required: [assetIds]
      properties:
        assetIds: { $ref: '#/components/schemas/BatchAssetIds' }
        reasonType: { type: integer, minimum: 1, default: 1 }
        reason: { type: [string, 'null'], maxLength: 500 }
        idempotencyKey: { type: [string, 'null'], maxLength: 128 }
    BatchConfigureItem:
      type: object
      additionalProperties: false
      minProperties: 2
      required: [assetId]
      description: >-
        One asset's changes. At least one of employeeId and addressPageId must
        be explicitly present. Omitted fields remain unchanged; JSON null
        clears the corresponding relation.
      anyOf:
        - required: [employeeId]
        - required: [addressPageId]
      properties:
        assetId: { $ref: '#/components/schemas/Id' }
        employeeId: { $ref: '#/components/schemas/NullableId' }
        addressPageId: { $ref: '#/components/schemas/NullableId' }
        reasonType: { type: integer, minimum: 1, default: 1 }
        reason: { type: [string, 'null'], maxLength: 500 }
    BatchConfigureRequest:
      type: object
      additionalProperties: false
      description: >-
        Use exactly one request mode. The legacy assetIds mode applies one
        addressPageId and optional employeeId to every selected asset. The
        items mode supplies independent changes per asset. IDs are positive
        BIGINT decimal strings; clients must not submit targetUrl, LinkForty
        IDs, or display labels. The Idempotency-Key header and request body
        are normalized together for batch replay/conflict detection.
      oneOf:
        - required: [assetIds, addressPageId]
          not:
            required: [items]
        - required: [items]
          not:
            anyOf:
              - required: [assetIds]
              - required: [employeeId]
              - required: [addressPageId]
      properties:
        assetIds: { $ref: '#/components/schemas/BatchAssetIds' }
        addressPageId: { $ref: '#/components/schemas/NullableId' }
        employeeId: { $ref: '#/components/schemas/NullableId' }
        items:
          type: array
          minItems: 1
          maxItems: 100000
          uniqueItems: true
          items: { $ref: '#/components/schemas/BatchConfigureItem' }
        idempotencyKey: { type: [string, 'null'], maxLength: 128 }
    AssetConfigurationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        Include employeeId and/or addressPageId to replace or clear the current
        binding. An explicit JSON null clears that relation; at least one of
        these two fields must be present.
      properties:
        employeeId: { $ref: '#/components/schemas/NullableId' }
        addressPageId: { $ref: '#/components/schemas/NullableId' }
        reasonType: { type: integer, minimum: 1, default: 1 }
        reason: { type: [string, 'null'], maxLength: 500 }
    TouchpointPayloadCreateRequest:
      type: object
      additionalProperties: false
      description: >-
        The asset is identified by the path parameter. When addressPageId is
        supplied for an additional Payload, the backend creates the LinkForty
        Link and uses its returned short link as payloadValue. The initial
        Payload created with an asset stores a bank-generated or custom
        shortCode locally and waits for the address-page binding. Clients must
        not supply linkfortyLinkId or an arbitrary targetUrl.
      required: [payloadType, payloadSource]
      properties:
        payloadType: { type: integer, enum: [1, 2, 3, 99] }
        payloadValue: { type: string, minLength: 1, maxLength: 2048, description: 'NFC 实际写入值；选择 addressPageId 时由后端生成，可省略。' }
        addressPageId: { $ref: '#/components/schemas/NullableId' }
        payloadSource: { type: integer, enum: [1, 2, 3, 4] }
        providerType: { type: integer, enum: [1, 2, 3, 99], default: 1 }
        metadata: { $ref: '#/components/schemas/Metadata' }
    TouchpointPayloadPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        payloadValue: { type: string, minLength: 1, maxLength: 2048 }
        addressPageId: { $ref: '#/components/schemas/NullableId' }
        payloadSource: { type: integer, enum: [1, 2, 3, 4] }
        providerType: { type: integer, enum: [1, 2, 3, 99] }
        metadata: { $ref: '#/components/schemas/Metadata' }
    TouchpointPayloadSwitchAddressPageRequest:
      type: object
      additionalProperties: false
      required: [addressPageId]
      properties:
        addressPageId: { $ref: '#/components/schemas/Id' }
    TouchpointAddressPageCreateRequest:
      type: object
      additionalProperties: false
      description: >-
        addressCode is server-generated from contentType and is returned by the
        response. It is not accepted from the client; existing address codes are
        preserved only by the trusted import update path.
      required: [addressName, url, orgId]
      properties:
        addressName: { type: string, minLength: 1, maxLength: 128 }
        url: { type: string, minLength: 1, maxLength: 2048, description: '地址展示值；可为小程序、APP 或网页载荷，不限制 HTTP/HTTPS scheme。' }
        targetUrl: { type: [string, 'null'], minLength: 1, maxLength: 2048, description: '实际目标内容；可为小程序、APP 或网页载荷，不限制 HTTP/HTTPS scheme；缺省时取 url。' }
        contentType: { type: integer, enum: [1, 2, 3], default: 3, description: '1 小程序，2 APP，3 网页；地址编码由服务端按类型自动生成' }
        orgId: { $ref: '#/components/schemas/Id' }
        description: { type: [string, 'null'], maxLength: 500 }
        metadata: { $ref: '#/components/schemas/Metadata' }
    TouchpointAddressPagePatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        addressName: { type: string, minLength: 1, maxLength: 128 }
        url: { type: string, minLength: 1, maxLength: 2048 }
        targetUrl: { type: [string, 'null'], minLength: 1, maxLength: 2048, description: '实际目标内容；不限制 HTTP/HTTPS scheme。' }
        contentType: { type: integer, enum: [1, 2, 3], description: '1 小程序，2 APP，3 网页' }
        description: { type: [string, 'null'], maxLength: 500 }
        metadata: { $ref: '#/components/schemas/Metadata' }
    AssignmentCreateRequest:
      type: object
      additionalProperties: false
      required: [assetId, employeeId]
      properties:
        assetId: { $ref: '#/components/schemas/Id' }
        employeeId: { $ref: '#/components/schemas/Id' }
    AssignmentUnbindRequest:
      type: object
      additionalProperties: false
      required: [reasonType]
      properties:
        reasonType: { type: integer, minimum: 1 }
        reason: { type: [string, 'null'], maxLength: 500 }
    AssignmentTransferRequest:
      type: object
      additionalProperties: false
      required: [assetId, targetEmployeeId, reasonType]
      properties:
        assetId: { $ref: '#/components/schemas/Id' }
        targetEmployeeId: { $ref: '#/components/schemas/Id' }
        reasonType: { type: integer, minimum: 1 }
        reason: { type: [string, 'null'], maxLength: 500 }
    Organization:
      type: object
      additionalProperties: false
      required: [id, orgCode, orgName, orgAbbr, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        orgCode: { type: string }
        orgName: { type: string }
        orgAbbr: { type: string, minLength: 2, maxLength: 12, pattern: '^[A-Z][A-Z0-9]{1,11}$', readOnly: true, description: '服务端生成且创建后稳定不变的机构缩写。' }
        status: { $ref: '#/components/schemas/Status' }
        sortNo: { type: integer }
        locationCode: { type: [string, 'null'] }
        doorNo: { type: [string, 'null'] }
        contactName: { type: [string, 'null'] }
        contactPhoneMasked: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
    Employee:
      type: object
      additionalProperties: false
      required: [id, employeeCode, employeeUid, employeeName, orgId, orgName, status]
      description: >-
        employeeCode is the employee number and Casdoor authentication mapping;
        employeeUid is a separate server-generated display ID and never replaces
        employeeCode for authentication.
      properties:
        id: { $ref: '#/components/schemas/Id' }
        employeeCode: { type: string }
        employeeUid: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Z][A-Z0-9]{1,11}-E-[0-9]{6}$', readOnly: true, description: '服务端生成的员工ID，只读，不参与 Casdoor 认证。' }
        employeeName: { type: string }
        orgId: { $ref: '#/components/schemas/Id' }
        orgName: { type: string }
        phoneMasked: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/Status' }
        description: { type: [string, 'null'] }
    EmployeeListItem:
      type: object
      additionalProperties: false
      required: [id, employeeCode, employeeUid, employeeName, orgId, orgName, phoneMasked, status, associatedCardCount]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        employeeCode: { type: string }
        employeeUid: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Z][A-Z0-9]{1,11}-E-[0-9]{6}$' }
        employeeName: { type: string }
        orgId: { $ref: '#/components/schemas/Id' }
        orgName: { type: string }
        phoneMasked: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/Status' }
        associatedCardCount: { type: [integer, 'null'], minimum: 0, description: '当前有效 M4 绑定卡数量；按 distinct asset_id 聚合。缺少 touchpoint.assignment.read 或 touchpoint.asset.read 时为 null，不表示数量为 0。' }
    EmployeeListData:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EmployeeListItem' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    EmployeeAssociatedCardEmployee:
      type: object
      additionalProperties: false
      required: [id, employeeCode, employeeUid, employeeName, orgId, orgName, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        employeeCode: { type: string }
        employeeUid: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Z][A-Z0-9]{1,11}-E-[0-9]{6}$' }
        employeeName: { type: string }
        orgId: { $ref: '#/components/schemas/Id' }
        orgName: { type: string }
        status: { $ref: '#/components/schemas/Status' }
    EmployeeAssociatedCardAddressPage:
      type: object
      additionalProperties: false
      required: [id, addressCode, addressName, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        addressCode: { type: string, maxLength: 64 }
        addressName: { type: string, maxLength: 128 }
        status: { type: integer, enum: [0, 1] }
    EmployeeAssociatedCardItem:
      type: object
      additionalProperties: false
      required: [assetId, carrierUid, supplierBatchNo, assignmentStatus, assetStatus, addressPages]
      properties:
        assetId: { type: string, minLength: 13, maxLength: 13, pattern: '^PK[0-9]{11}$' }
        carrierUid: { type: [string, 'null'], maxLength: 128 }
        supplierBatchNo: { type: [string, 'null'], maxLength: 64 }
        assignmentStatus: { type: integer, const: 1, description: '当前有效绑定关系。' }
