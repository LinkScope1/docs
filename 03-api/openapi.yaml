        - in: query
          name: assetId
          required: false
          description: Positive BIGINT identifier encoded as a decimal string.
          schema: { $ref: '#/components/schemas/Id' }
        - in: query
          name: orgId
          required: false
          description: Positive BIGINT identifier encoded as a decimal string; cannot expand scope.
          schema: { $ref: '#/components/schemas/Id' }
        - in: query
          name: employeeId
          required: false
          description: Positive BIGINT identifier encoded as a decimal string; cannot expand scope.
          schema: { $ref: '#/components/schemas/Id' }
        - in: query
          name: resolutionStatus
          required: false
          description: Association status, where 0=pending, 1=success, 2=retry, 3=failed.
          schema: { type: integer, enum: [0, 1, 2, 3] }
        - in: query
          name: from
          required: false
          description: Inclusive RFC3339 start time with timezone; must not be later than `to`.
          schema: { type: string, format: date-time }
        - in: query
