  /access-events:
    get:
      tags: [access-events]
      operationId: listAccessEvents
      x-owner: API/后端
      summary: List access events in the caller scope
      description: >-
        Read-only, non-audited access-event query. Filters can only narrow the
        caller's effective ORG_SUBTREE scope. `from` is inclusive and `to` is
        exclusive; both must include a timezone and `from` may equal `to`.
      x-permission: access-event.read
      x-data-scope: ORG_SUBTREE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - in: query
          name: assetId
          required: false
          description: Positive BIGINT identifier encoded as a decimal string.
          schema: { $ref: '#/components/schemas/Id' }
        - in: query
          name: orgId
          required: false
          description: Positive BIGINT identifier encoded as a decimal string; cannot expand scope.
          schema: { $ref: '#/components/schemas/Id' }
        - in: query
          name: employeeId
          required: false
          description: Positive BIGINT identifier encoded as a decimal string; cannot expand scope.
          schema: { $ref: '#/components/schemas/Id' }
        - in: query
          name: resolutionStatus
          required: false
          description: Association status, where 0=pending, 1=success, 2=retry, 3=failed.
          schema: { type: integer, enum: [0, 1, 2, 3] }
        - in: query
          name: from
          required: false
          description: Inclusive RFC3339 start time with timezone; must not be later than `to`.
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: false
          description: Exclusive RFC3339 end time with timezone; must not be earlier than `from`.
          schema: { type: string, format: date-time }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/RequestSchemaInvalid' }
        '500': { $ref: '#/components/responses/InternalError' }
        '200': { $ref: '#/components/responses/Success' }
  /access-events/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [access-events]
      operationId: getAccessEvent
      x-owner: API/后端
      summary: Get an access event
      x-permission: access-event.read
      x-data-scope: ORG_SUBTREE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      description: Read-only, non-audited detail query restricted to the caller's effective scope.
      security: [{ sessionCookie: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/RequestSchemaInvalid' }
        '500': { $ref: '#/components/responses/InternalError' }
        '200': { $ref: '#/components/responses/Success' }

  /webhooks/linkforty:
    post:
      tags: [linkforty-webhooks]
      operationId: receiveLinkFortyWebhook
      x-owner: API/后端/LinkForty联调
      summary: Receive a signed LinkForty click event
      x-permission: system_webhook
      x-data-scope: SYSTEM
      x-idempotency: event_id
      x-audit: true
      x-status: reviewed
      description: >-
        Receive a LinkForty `click_event`. The server verifies the HMAC-SHA256
        signature against the exact raw request bytes before parsing JSON. The
        `system_webhook` permission is an integration identity and is not a
        Casdoor user permission.
      parameters:
        - in: header
          name: X-LinkForty-Signature
          required: true
          schema: { type: string, pattern: '^sha256=[0-9a-fA-F]{64}$' }
        - in: header
          name: X-LinkForty-Event
          required: false
          schema: { type: string, maxLength: 64 }
        - in: header
          name: X-LinkForty-Event-ID
          required: false
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        description: JSON object with the canonical event envelope. Raw bytes are used for HMAC verification; secrets and raw bodies are never part of this contract.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkFortyWebhookEnvelope' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RequestSchemaInvalid' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DataSourceUnavailable' }

  /analytics/summary:
    get:
      tags: [analytics]
      operationId: getAnalyticsSummary
      x-owner: API/后端/统计
      summary: Read click and access metrics with compatibility-preserved install/App fields
      description: >-
        V1.3.2 reads LinkForty data through API-only integration. The summary is
        defined over the half-open interval [from,to). The current Core API
        exposes click analytics only as a rolling days window, so a non-empty
        LinkForty scope cannot satisfy this exact interval and fails with
        DATA_SOURCE_UNAVAILABLE. Install/App aggregate success capability is
        excluded from V1.3.2; the response fields remain for compatibility, but
        unsupported required sources fail the whole request with
        DATA_SOURCE_UNAVAILABLE, without data or partial click/access results.
      x-permission: analytics.read
      x-data-scope: ORG_SUBTREE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: from
          required: true
          description: Inclusive timezone-aware start time; must be earlier than to.
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: true
          description: Exclusive timezone-aware end time; must be later than from.
          schema: { type: string, format: date-time }
        - in: query
          name: orgCodePrefix
          required: false
          description: Optional scope narrowing prefix; it cannot expand AccessContext.
          schema: { type: string, maxLength: 64, pattern: '^1([0-9]{3})*$' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/RequestSchemaInvalid' }
        '200': { $ref: '#/components/responses/AnalyticsSuccess' }
        '503': { $ref: '#/components/responses/DataSourceUnavailable' }

  /imports/validate:
    post:
      tags: [imports]
      operationId: validateImport
      x-owner: API/后端/导入
      summary: Validate an import file without writing business tables
      description: >-
       Synchronous, read-only CSV pre-validation. Only assignment rows carry
       the required explicit operation column, whose accepted values are bind,
       unbind and transfer. Rows omitted from the CSV are ignored and never
       imply deletion, disabling or unbinding. Employee and organization
       templates are also supported for pre-validation; the import execution
       endpoints are exposed separately for small master-data batches.
      x-permission: import.validate
      x-data-scope: ORG_SUBTREE
      x-idempotency: none
      x-audit: true
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, templateType]
              properties:
                file: { type: string, format: binary }
                templateType: { type: string, enum: [payload, assignment, asset_payload_relation, employee, organization] }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/ImportFileTooLarge' }
        '415': { $ref: '#/components/responses/ImportFileTypeInvalid' }
        '422': { $ref: '#/components/responses/RequestSchemaInvalid' }

  /imports/templates/employees:
    get:
      tags: [imports]
      operationId: downloadEmployeeImportTemplate
      x-owner: API/后端/导入
      summary: Download the employee master-data CSV template
      description: >-
        Downloads a UTF-8 BOM CSV named 员工导入模板.csv with the fixed header
        员工编号,姓名,所属组织编码,手机号,状态,备注.
        员工编号, 姓名 and 所属组织编码 are required. 手机号,
        status and description are optional; status accepts enabled or
        disabled, and is disabled by default when creating a new employee.
        The template writes its phone sample in the Excel text-literal form
        ="13800001234"; the importer safely restores that form to a phone
        number. The two sample rows must be replaced or deleted before upload.
      x-permission: import.validate
      x-data-scope: ORG_SUBTREE
      x-idempotency: none
      x-audit: false
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: UTF-8 BOM CSV template
          headers:
            X-Request-ID: { schema: { type: string } }
          content:
            text/csv: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /imports/employees/execute:
    post:
      tags: [imports]
      operationId: executeEmployeeImport
      x-owner: API/后端/导入
      summary: Execute a small employee master-data CSV import
      description: >-
        Synchronously creates or updates at most 1,000 employee rows. Rows are
        committed independently: a failed row does not roll back successful
        rows. An existing employee must remain in the same organization;
        organization changes must use the employee transfer API. The response
        includes a Base64 UTF-8 BOM failure-report CSV only when failures exist.
      x-permission: employee.manage
      x-data-scope: ORG_SUBTREE
      x-idempotency: none
      x-audit: true
      x-status: reviewed
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Import execution summary; individual rows can fail.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeImportExecutionSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/ImportFileTooLarge' }
        '415': { $ref: '#/components/responses/ImportFileTypeInvalid' }
        '422': { $ref: '#/components/responses/RequestSchemaInvalid' }

  /imports/templates/organizations:
    get:
      tags: [imports]
      operationId: downloadOrganizationImportTemplate
      x-owner: API/后端/导入
      summary: Download the organization master-data CSV template
      description: >-
        Downloads a UTF-8 BOM CSV named 组织导入模板.csv. The fixed Chinese
        headers are 组织编码、组织名称、排序号、网点编码、门店号、联系人、联系电话、状态、备注.
        The two sample rows must be replaced or deleted before upload.
      x-permission: import.validate
