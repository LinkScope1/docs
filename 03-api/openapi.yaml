        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Import execution summary; individual rows can fail.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
