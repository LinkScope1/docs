      type: object
      additionalProperties: false
      required: [requestId, data]
      properties:
        requestId: { type: string }
        data: { $ref: '#/components/schemas/BulkOperationData' }
    SuccessEnvelope:
      type: object
      required: [requestId, data]
      properties:
        requestId: { type: string }
        data:
          nullable: true
          oneOf:
            - { $ref: '#/components/schemas/Page' }
            - { $ref: '#/components/schemas/Organization' }
            - type: array
              items: { $ref: '#/components/schemas/OrganizationTreeNode' }
            - { $ref: '#/components/schemas/Employee' }
            - { $ref: '#/components/schemas/EmployeeListData' }
            - { $ref: '#/components/schemas/EmployeeAssociatedCardData' }
            - { $ref: '#/components/schemas/TouchpointAsset' }
            - { $ref: '#/components/schemas/TouchpointPayload' }
            - { $ref: '#/components/schemas/Assignment' }
            - { $ref: '#/components/schemas/AccessEvent' }
            - { $ref: '#/components/schemas/AuditLogDetail' }
            - { $ref: '#/components/schemas/AnalyticsSummaryData' }
            - { $ref: '#/components/schemas/WebhookAcceptedData' }
            - { $ref: '#/components/schemas/PhysicalDeleteResult' }
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [field, type]
      properties:
        field: { type: string }
        type: { type: string }
        message: { type: string }
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: array
          items: { $ref: '#/components/schemas/ErrorDetail' }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [requestId, error]
      properties:
        requestId: { type: string }
        error: { $ref: '#/components/schemas/Error' }
    LinkFortyWebhookEnvelope:
      type: object
      additionalProperties: true
      required: [event, event_id, data]
      description: >-
        Canonical LinkForty envelope. `eventId` may be accepted as a legacy
        input alias by the runtime, but `event_id` is the formal contract.
        The request body must be an object and `data.id`/`data.linkId` are UUIDs.
      properties:
        event: { type: string, enum: [click_event], maxLength: 64 }
        event_id: { type: string, minLength: 1, maxLength: 255 }
        timestamp: { type: string, format: date-time }
        data:
          type: object
          required: [id, linkId]
          properties:
            id: { type: string, format: uuid }
            linkId: { type: string, format: uuid }
          additionalProperties: true
    WebhookAcceptedData:
      type: object
      additionalProperties: false
      required: [eventId, accessEventId, replayed]
      properties:
        eventId: { type: string, minLength: 1, maxLength: 255 }
        accessEventId: { $ref: '#/components/schemas/Id' }
        replayed: { type: boolean }
  responses:
    AuditLogListSuccess:
      description: Paginated operation-log summaries in the caller scope.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema:
            type: object
            required: [requestId, data]
            additionalProperties: false
            properties:
              requestId: { type: string }
              data:
                type: object
                required: [items, page, pageSize, total]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLogSummary' }
                  page: { type: integer, minimum: 1 }
                  pageSize: { type: integer, minimum: 1 }
                  total: { type: integer, minimum: 0 }
    AuditLogDetailSuccess:
      description: One sanitized operation-log detail in the caller scope.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema:
            type: object
            required: [requestId, data]
            additionalProperties: false
            properties:
              requestId: { type: string }
              data: { $ref: '#/components/schemas/AuditLogDetail' }
    AnalyticsSuccess:
      description: Analytics summary with four aggregate counters
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema:
            type: object
            required: [requestId, data]
            additionalProperties: false
            properties:
              requestId: { type: string }
              data: { $ref: '#/components/schemas/AnalyticsSummaryData' }
    Success:
      description: Successful response. The JSON body includes `requestId` and the response includes the matching `X-Request-ID` header.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } }
    Accepted:
      description: Accepted or duplicate event acknowledged. A successful replay includes the Idempotency-Replayed response header.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
        Idempotency-Replayed:
          description: Present with value true when an existing event_id was replayed successfully.
          schema: { type: string, enum: ["true"] }
      content:
        application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } }
    BadRequest:
      description: >-
        Business request failure. For M5 Webhook this includes
        WEBHOOK_EVENT_ID_MISSING and malformed JSON/envelope
        REQUEST_SCHEMA_INVALID responses.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    BadGateway:
      description: LinkForty Core target update failed or compensation could not complete.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    RequestSchemaInvalid:
      description: Request structure, field type, format or required-field validation failure (REQUEST_SCHEMA_INVALID).
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    Unauthorized:
      description: >-
        Authentication or signature failure. For M5 Webhook an invalid HMAC
        uses WEBHOOK_SIGNATURE_INVALID.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    Forbidden:
      description: >-
        Permission or data scope denied, using PERMISSION_DENIED or
        DATA_SCOPE_DENIED as the public error code.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    NotFound:
      description: Resource not found; the public error code is RESOURCE_NOT_FOUND.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    Conflict:
      description: >-
        Unique, state, assignment or daily card-ID sequence conflict. M3 card
        ID exhaustion uses ASSET_ID_EXHAUSTED; M5 Webhook state conflicts use
        STATE_CONFLICT.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    DataSourceUnavailable:
      description: >-
        An external data source, an intentionally unsupported V1.3.2 metric, or
        required Webhook signing configuration is unavailable; the public error
        code is DATA_SOURCE_UNAVAILABLE. The response contains no successful
        data when a required source is unavailable.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    InternalError:
      description: Unexpected internal error; the response contains no stack trace or sensitive details.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    ExportLimitExceeded:
      description: Synchronous export exceeds the V1.3.2 limit
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    ImportFileTooLarge:
      description: Import file exceeds the 10 MiB or 100,000 data-row limit
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    ImportFileTypeInvalid:
      description: Import file name or Content-Type is not supported
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
  headers:
    RequestId:
      description: Correlation ID; exactly matches the response body's `requestId`.
      schema: { type: string, minLength: 1, maxLength: 128 }
    ExportStatus:
      description: Export processing status; present on successful CSV responses.
      schema: { type: string, const: completed }
    ExportOutcome:
      description: Export result classification.
      schema: { type: string, const: success }
    ExportMessageCode:
      description: Stable completion message code for the export dialog.
      schema: { type: string, const: EXPORT_COMPLETED }
    ExportCount:
      description: Non-negative number of exported data rows.
      schema: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
