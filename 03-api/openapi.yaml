components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, pattern: '^[0-9]*[1-9][0-9]*$' }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  requestBodies:
    OrganizationCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrganizationCreateRequest' }
    OrganizationPatch:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrganizationPatchRequest' }
    EmployeeCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EmployeeCreateRequest' }
    EmployeePatch:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EmployeePatchRequest' }
    EmployeeTransfer:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EmployeeTransferRequest' }
    TouchpointAssetCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TouchpointAssetCreateRequest' }
    TouchpointAssetPatch:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TouchpointAssetPatchRequest' }
    TouchpointPayloadCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TouchpointPayloadCreateRequest' }
    TouchpointPayloadPatch:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TouchpointPayloadPatchRequest' }
    AssignmentCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AssignmentCreateRequest' }
    AssignmentUnbind:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AssignmentUnbindRequest' }
    AssignmentTransfer:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AssignmentTransferRequest' }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: bank_admin_session
  schemas:
    AuthMeData:
      type: object
      additionalProperties: false
      required:
        [employeeId, employeeCode, employeeName, orgId, orgCode, orgName,
         roles, permissions, scope, scopeRoots]
      description: >-
        Normalized server-side session context. It never contains a subject,
        access_token, id_token, refresh_token, password or secret.
      properties:
        employeeId: { $ref: '#/components/schemas/Id' }
        employeeCode: { type: string, minLength: 1, maxLength: 64 }
        employeeName: { type: string, minLength: 1, maxLength: 100 }
        orgId: { $ref: '#/components/schemas/Id' }
        orgCode: { type: string, minLength: 1, maxLength: 64 }
        orgName: { type: string, minLength: 1, maxLength: 128 }
        roles:
          type: array
          items: { type: string, minLength: 1 }
        permissions:
          type: array
          items: { type: string, minLength: 1 }
        scope:
          type: string
          enum: [GLOBAL, ORG_SUBTREE, ORG_SELF, EMPLOYEE_SELF, ASSET_SCOPE]
        scopeRoots:
          type: array
          items: { type: string, minLength: 1 }
    Id:
      type: string
      pattern: '^[0-9]*[1-9][0-9]*$'
      description: Positive BIGINT identifiers are transported as decimal strings.
    NullableId:
      type: [string, 'null']
      pattern: '^[0-9]*[1-9][0-9]*$'
      description: Nullable positive BIGINT identifier encoded as a decimal string.
    Status:
      type: integer
      minimum: 0
    Metadata:
      type: object
      additionalProperties: true
    OrganizationCreateRequest:
      type: object
      additionalProperties: false
      required: [orgCode, orgName]
      properties:
        orgCode: { type: string, maxLength: 64, pattern: '^1([0-9]{3})*$' }
        orgName: { type: string, minLength: 1, maxLength: 128 }
        sortNo: { type: integer, default: 100 }
        locationCode: { type: [string, 'null'], maxLength: 64 }
        doorNo: { type: [string, 'null'], maxLength: 32 }
        contactName: { type: [string, 'null'], maxLength: 100 }
        contactPhone: { type: [string, 'null'], maxLength: 32, writeOnly: true }
        description: { type: [string, 'null'], maxLength: 500 }
    OrganizationPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        orgName: { type: string, minLength: 1, maxLength: 128 }
        sortNo: { type: integer }
        locationCode: { type: [string, 'null'], maxLength: 64 }
        doorNo: { type: [string, 'null'], maxLength: 32 }
        contactName: { type: [string, 'null'], maxLength: 100 }
        contactPhone: { type: [string, 'null'], maxLength: 32, writeOnly: true }
        description: { type: [string, 'null'], maxLength: 500 }
    EmployeeCreateRequest:
      type: object
      additionalProperties: false
      required: [employeeCode, employeeName, orgId]
      properties:
        employeeCode: { type: string, minLength: 1, maxLength: 64 }
        employeeName: { type: string, minLength: 1, maxLength: 100 }
        orgId: { $ref: '#/components/schemas/Id' }
        phone: { type: [string, 'null'], maxLength: 32, writeOnly: true }
        description: { type: [string, 'null'], maxLength: 500 }
    EmployeePatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        employeeName: { type: string, minLength: 1, maxLength: 100 }
        phone: { type: [string, 'null'], maxLength: 32, writeOnly: true }
        description: { type: [string, 'null'], maxLength: 500 }
    EmployeeTransferRequest:
      type: object
      additionalProperties: false
      required: [targetOrgId]
      properties:
        targetOrgId: { $ref: '#/components/schemas/Id' }
        reason: { type: [string, 'null'], maxLength: 500 }
    TouchpointAssetCreateRequest:
      type: object
      additionalProperties: false
      required: [assetCode, orgId]
      properties:
        assetCode: { type: string, minLength: 1, maxLength: 64 }
        assetType: { type: integer, const: 1, default: 1 }
        carrierUid: { type: [string, 'null'], maxLength: 128 }
        orgId: { $ref: '#/components/schemas/Id' }
        supplierCode: { type: [string, 'null'], maxLength: 64 }
        supplierBatchNo: { type: [string, 'null'], maxLength: 64 }
        metadata: { $ref: '#/components/schemas/Metadata' }
        description: { type: [string, 'null'], maxLength: 500 }
    TouchpointAssetPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        carrierUid: { type: [string, 'null'], maxLength: 128 }
        supplierCode: { type: [string, 'null'], maxLength: 64 }
        supplierBatchNo: { type: [string, 'null'], maxLength: 64 }
        metadata: { $ref: '#/components/schemas/Metadata' }
        description: { type: [string, 'null'], maxLength: 500 }
    TouchpointPayloadCreateRequest:
      type: object
      additionalProperties: false
      required: [assetId, payloadType, payloadValue, payloadSource]
      properties:
        assetId: { $ref: '#/components/schemas/Id' }
        payloadType: { type: integer, enum: [1, 2, 3, 99] }
        payloadValue: { type: string, minLength: 1, maxLength: 2048 }
        payloadSource: { type: integer, enum: [1, 2, 3, 4] }
        providerType: { type: integer, enum: [1, 2, 3, 99], default: 1 }
        linkfortyLinkId: { type: [string, 'null'], format: uuid }
        metadata: { $ref: '#/components/schemas/Metadata' }
    TouchpointPayloadPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        payloadValue: { type: string, minLength: 1, maxLength: 2048 }
        payloadSource: { type: integer, enum: [1, 2, 3, 4] }
        providerType: { type: integer, enum: [1, 2, 3, 99] }
        linkfortyLinkId: { type: [string, 'null'], format: uuid }
        metadata: { $ref: '#/components/schemas/Metadata' }
    AssignmentCreateRequest:
      type: object
      additionalProperties: false
      required: [assetId, employeeId]
      properties:
        assetId: { $ref: '#/components/schemas/Id' }
        employeeId: { $ref: '#/components/schemas/Id' }
    AssignmentUnbindRequest:
      type: object
      additionalProperties: false
      required: [reasonType]
      properties:
        reasonType: { type: integer, minimum: 1 }
        reason: { type: [string, 'null'], maxLength: 500 }
    AssignmentTransferRequest:
      type: object
      additionalProperties: false
      required: [assetId, targetEmployeeId, reasonType]
      properties:
        assetId: { $ref: '#/components/schemas/Id' }
        targetEmployeeId: { $ref: '#/components/schemas/Id' }
        reasonType: { type: integer, minimum: 1 }
        reason: { type: [string, 'null'], maxLength: 500 }
    Organization:
      type: object
      additionalProperties: false
      required: [id, orgCode, orgName, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        orgCode: { type: string }
        orgName: { type: string }
        status: { $ref: '#/components/schemas/Status' }
        sortNo: { type: integer }
        locationCode: { type: [string, 'null'] }
        doorNo: { type: [string, 'null'] }
        contactName: { type: [string, 'null'] }
        contactPhoneMasked: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
    Employee:
      type: object
      additionalProperties: false
      required: [id, employeeCode, employeeName, orgId, orgName, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        employeeCode: { type: string }
        employeeName: { type: string }
        orgId: { $ref: '#/components/schemas/Id' }
        orgName: { type: string }
        phoneMasked: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/Status' }
        description: { type: [string, 'null'] }
    TouchpointAsset:
      type: object
      additionalProperties: false
      required: [id, assetCode, assetType, orgId, assetStatus]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        assetCode: { type: string }
        assetType: { type: integer, const: 1 }
        carrierUid: { type: [string, 'null'] }
        orgId: { $ref: '#/components/schemas/Id' }
        employeeId: { $ref: '#/components/schemas/NullableId' }
        assetStatus: { $ref: '#/components/schemas/Status' }
        supplierCode: { type: [string, 'null'] }
        supplierBatchNo: { type: [string, 'null'] }
        metadata: { $ref: '#/components/schemas/Metadata' }
        description: { type: [string, 'null'] }
    TouchpointPayload:
      type: object
      additionalProperties: false
      required: [id, assetId, payloadType, payloadValue, payloadSource, providerType, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        assetId: { $ref: '#/components/schemas/Id' }
        orgId: { $ref: '#/components/schemas/Id' }
        employeeId: { $ref: '#/components/schemas/NullableId' }
        payloadType: { type: integer }
        payloadValue: { type: string }
        payloadSource: { type: integer }
        providerType: { type: integer }
        linkfortyLinkId: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/Status' }
        metadata: { $ref: '#/components/schemas/Metadata' }
    Assignment:
      type: object
      additionalProperties: false
      required: [id, assetId, orgId, employeeId, assignmentStatus, effectiveFrom]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        assetId: { $ref: '#/components/schemas/Id' }
        orgId: { $ref: '#/components/schemas/Id' }
        employeeId: { $ref: '#/components/schemas/Id' }
        assignmentStatus: { type: integer, enum: [1, 2] }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: [string, 'null'], format: date-time }
        unbindReasonType: { type: [integer, 'null'] }
        unbindReason: { type: [string, 'null'] }
        replayed: { type: boolean }
    AccessEvent:
      type: object
      additionalProperties: false
      required:
        [id, eventId, clickId, assetId, bindingId, orgId, employeeId,
         resolutionStatus, resolutionReason, receivedAt, resolvedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        eventId: { type: string, minLength: 1, maxLength: 255 }
        clickId: { type: string, format: uuid }
        assetId: { $ref: '#/components/schemas/Id' }
        bindingId: { $ref: '#/components/schemas/NullableId' }
        orgId: { $ref: '#/components/schemas/NullableId' }
        employeeId: { $ref: '#/components/schemas/NullableId' }
        resolutionStatus: { type: integer, enum: [0, 1, 2, 3] }
        resolutionReason: { type: [string, 'null'] }
        receivedAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
    AuditLogSummary:
      type: object
      additionalProperties: false
      required:
        [id, traceId, orgId, employeeId, operationType, objectType, objectId,
         operationResult, operationSummary, errorCode, operationTime]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        traceId: { type: string, maxLength: 64 }
        orgId: { $ref: '#/components/schemas/NullableId' }
        employeeId: { $ref: '#/components/schemas/NullableId' }
        operationType: { type: integer }
        objectType: { type: integer }
        objectId: { $ref: '#/components/schemas/NullableId' }
        operationResult: { type: integer, enum: [1, 2, 3] }
        operationSummary: { type: [string, 'null'], maxLength: 1000 }
        errorCode: { type: [string, 'null'], maxLength: 64 }
        operationTime: { type: string, format: date-time }
    AuditLogDetail:
      type: object
      additionalProperties: false
      required:
        [id, traceId, orgId, employeeId, operationType, objectType, objectId,
         operationResult, operationSummary, errorCode, operationTime,
         externalObjectId, operationDetail, beforeData, afterData, errorMessage,
         userAgent, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        traceId: { type: string, maxLength: 64 }
        orgId: { $ref: '#/components/schemas/NullableId' }
        employeeId: { $ref: '#/components/schemas/NullableId' }
        operationType: { type: integer }
        objectType: { type: integer }
        objectId: { $ref: '#/components/schemas/NullableId' }
        operationResult: { type: integer, enum: [1, 2, 3] }
        operationSummary: { type: [string, 'null'], maxLength: 1000 }
        errorCode: { type: [string, 'null'], maxLength: 64 }
        operationTime: { type: string, format: date-time }
        externalObjectId: { type: [string, 'null'], format: uuid }
        operationDetail: { type: object, additionalProperties: true }
        beforeData: { type: [object, 'null'], additionalProperties: true }
        afterData: { type: [object, 'null'], additionalProperties: true }
        errorMessage: { type: [string, 'null'], maxLength: 500 }
        userAgent: { type: [string, 'null'], maxLength: 512 }
        createdAt: { type: string, format: date-time }
    Page:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            oneOf:
              - { $ref: '#/components/schemas/Organization' }
              - { $ref: '#/components/schemas/Employee' }
              - { $ref: '#/components/schemas/TouchpointAsset' }
              - { $ref: '#/components/schemas/TouchpointPayload' }
              - { $ref: '#/components/schemas/Assignment' }
              - { $ref: '#/components/schemas/AccessEvent' }
              - { $ref: '#/components/schemas/AuditLogSummary' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    AnalyticsSummaryData:
      type: object
      additionalProperties: false
      required: [from, to, orgCodePrefix, clickCount, accessCount, installCount, inAppCount]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        orgCodePrefix: { type: [string, 'null'], maxLength: 64 }
        clickCount: { type: integer, minimum: 0 }
        accessCount: { type: integer, minimum: 0 }
        installCount: { type: integer, minimum: 0 }
        inAppCount: { type: integer, minimum: 0 }
      description: >-
        LinkForty clicks use the Core click event clicked_at and exclude bots;
        access uses access_events.received_at. The installCount and inAppCount
        fields are retained for response compatibility, but their aggregate
        success capability is not included in V1.3.2. The underlying target
        event times are install_events.installed_at and
        in_app_events.event_timestamp for a future version. All counts are
        filtered by AccessContext. The bank backend does not read the LinkForty
        database; an unsupported required source returns
        DATA_SOURCE_UNAVAILABLE with no data and no partial response.
    EmployeeImportRowResult:
      type: object
      additionalProperties: false
      required: [rowNumber, status]
      properties:
        rowNumber: { type: integer, minimum: 2 }
        operation: { type: [string, 'null'], enum: [create, update, 'null'] }
        status: { type: string, enum: [success, failed] }
        errorCode: { type: [string, 'null'] }
        message: { type: [string, 'null'] }
    ImportFailureReport:
      type: object
      additionalProperties: false
      required: [filename, contentType, encoding, content]
      properties:
        filename: { type: string, const: 员工导入失败报告.csv }
        contentType: { type: string, const: text/csv;charset=utf-8 }
        encoding: { type: string, const: base64 }
        content:
          type: string
          description: >-
            Base64-encoded UTF-8 BOM CSV containing only failed rows. Columns
            are 行号、员工编号、姓名、所属组织编码、手机号、状态（原文件）、备注、操作、错误代码、错误原因.
    EmployeeImportExecutionData:
      type: object
      additionalProperties: false
      required: [total, succeeded, failed, failureReport, rows]
      properties:
        total: { type: integer, minimum: 0 }
        succeeded: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        failureReport:
          oneOf:
            - { $ref: '#/components/schemas/ImportFailureReport' }
            - { type: 'null' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/EmployeeImportRowResult' }
    EmployeeImportExecutionSuccess:
      type: object
      additionalProperties: false
      required: [requestId, data]
      properties:
        requestId: { type: string }
        data: { $ref: '#/components/schemas/EmployeeImportExecutionData' }
    OrganizationImportRowResult:
      type: object
      additionalProperties: false
      required: [rowNumber, status]
      properties:
        rowNumber: { type: integer, minimum: 2 }
        operation: { type: [string, 'null'], enum: [create, update, 'null'] }
        status: { type: string, enum: [success, failed] }
        errorCode: { type: [string, 'null'] }
        message: { type: [string, 'null'] }
    OrganizationImportFailureReport:
      type: object
      additionalProperties: false
      required: [filename, contentType, encoding, content]
      properties:
        filename: { type: string, const: 组织导入失败报告.csv }
        contentType: { type: string, const: text/csv;charset=utf-8 }
        encoding: { type: string, const: base64 }
        content: { type: string }
    OrganizationImportExecutionData:
      type: object
      additionalProperties: false
      required: [total, succeeded, failed, failureReport, rows]
      properties:
        total: { type: integer, minimum: 0 }
        succeeded: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        failureReport:
          oneOf:
            - { $ref: '#/components/schemas/OrganizationImportFailureReport' }
            - { type: 'null' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/OrganizationImportRowResult' }
    OrganizationImportExecutionSuccess:
      type: object
      additionalProperties: false
      required: [requestId, data]
      properties:
        requestId: { type: string }
        data: { $ref: '#/components/schemas/OrganizationImportExecutionData' }
    SuccessEnvelope:
      type: object
      required: [requestId, data]
      properties:
        requestId: { type: string }
        data:
          nullable: true
          oneOf:
            - { $ref: '#/components/schemas/Page' }
            - { $ref: '#/components/schemas/Organization' }
            - { $ref: '#/components/schemas/Employee' }
            - { $ref: '#/components/schemas/TouchpointAsset' }
            - { $ref: '#/components/schemas/TouchpointPayload' }
            - { $ref: '#/components/schemas/Assignment' }
            - { $ref: '#/components/schemas/AccessEvent' }
            - { $ref: '#/components/schemas/AuditLogDetail' }
            - { $ref: '#/components/schemas/AnalyticsSummaryData' }
            - { $ref: '#/components/schemas/WebhookAcceptedData' }
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [field, type]
      properties:
        field: { type: string }
        type: { type: string }
        message: { type: string }
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: array
          items: { $ref: '#/components/schemas/ErrorDetail' }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [requestId, error]
      properties:
        requestId: { type: string }
        error: { $ref: '#/components/schemas/Error' }
    LinkFortyWebhookEnvelope:
      type: object
      additionalProperties: true
      required: [event, event_id, data]
      description: >-
        Canonical LinkForty envelope. `eventId` may be accepted as a legacy
        input alias by the runtime, but `event_id` is the formal contract.
        The request body must be an object and `data.id`/`data.linkId` are UUIDs.
      properties:
        event: { type: string, enum: [click_event], maxLength: 64 }
        event_id: { type: string, minLength: 1, maxLength: 255 }
        timestamp: { type: string, format: date-time }
        data:
          type: object
          required: [id, linkId]
          properties:
            id: { type: string, format: uuid }
            linkId: { type: string, format: uuid }
          additionalProperties: true
    WebhookAcceptedData:
      type: object
      additionalProperties: false
      required: [eventId, accessEventId, replayed]
      properties:
        eventId: { type: string, minLength: 1, maxLength: 255 }
        accessEventId: { $ref: '#/components/schemas/Id' }
        replayed: { type: boolean }
  responses:
    AuditLogListSuccess:
      description: Paginated operation-log summaries in the caller scope.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema:
            type: object
            required: [requestId, data]
            additionalProperties: false
            properties:
              requestId: { type: string }
              data:
                type: object
                required: [items, page, pageSize, total]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLogSummary' }
                  page: { type: integer, minimum: 1 }
                  pageSize: { type: integer, minimum: 1 }
                  total: { type: integer, minimum: 0 }
    AuditLogDetailSuccess:
      description: One sanitized operation-log detail in the caller scope.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema:
            type: object
            required: [requestId, data]
            additionalProperties: false
            properties:
              requestId: { type: string }
              data: { $ref: '#/components/schemas/AuditLogDetail' }
    AnalyticsSuccess:
      description: Analytics summary with four aggregate counters
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema:
            type: object
            required: [requestId, data]
            additionalProperties: false
            properties:
              requestId: { type: string }
              data: { $ref: '#/components/schemas/AnalyticsSummaryData' }
    Success:
      description: Successful response. The JSON body includes `requestId` and the response includes the matching `X-Request-ID` header.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } }
    Accepted:
      description: Accepted or duplicate event acknowledged. A successful replay includes the Idempotency-Replayed response header.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
        Idempotency-Replayed:
          description: Present with value true when an existing event_id was replayed successfully.
          schema: { type: string, enum: ["true"] }
      content:
        application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } }
    BadRequest:
      description: >-
        Business request failure. For M5 Webhook this includes
        WEBHOOK_EVENT_ID_MISSING and malformed JSON/envelope
        REQUEST_SCHEMA_INVALID responses.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    RequestSchemaInvalid:
      description: Request structure, field type, format or required-field validation failure (REQUEST_SCHEMA_INVALID).
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    Unauthorized:
      description: >-
        Authentication or signature failure. For M5 Webhook an invalid HMAC
        uses WEBHOOK_SIGNATURE_INVALID.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    Forbidden:
      description: >-
        Permission or data scope denied, using PERMISSION_DENIED or
        DATA_SCOPE_DENIED as the public error code.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    NotFound:
      description: Resource not found; the public error code is RESOURCE_NOT_FOUND.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    Conflict:
      description: >-
        Unique, state or assignment conflict. M5 Webhook state conflicts use
        STATE_CONFLICT.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    DataSourceUnavailable:
      description: >-
        An external data source, an intentionally unsupported V1.3.2 metric, or
        required Webhook signing configuration is unavailable; the public error
        code is DATA_SOURCE_UNAVAILABLE. The response contains no successful
        data when a required source is unavailable.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    InternalError:
      description: Unexpected internal error; the response contains no stack trace or sensitive details.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    ExportLimitExceeded:
      description: Synchronous export exceeds the V1.3.2 limit
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    ImportFileTooLarge:
      description: Import file exceeds the 10 MiB or 100,000 data-row limit
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    ImportFileTypeInvalid:
      description: Import file name or Content-Type is not supported
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
  headers:
    RequestId:
      description: Correlation ID; exactly matches the response body's `requestId`.
      schema: { type: string, minLength: 1, maxLength: 128 }
